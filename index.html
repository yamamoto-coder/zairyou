const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ============================================================
// GitHub Pages 版: 保存はこのブラウザの localStorage に行う
// (Claudeアーティファクト版の window.storage 互換シム)
// ============================================================
// ============================================================
// サーバー接続の設定
//  API_BASE が設定されていればサーバー保存(会社ごとに分離・全社員で共有)。
//  空にすると従来どおり各パソコンのブラウザ内保存で動く。
// ============================================================
// 同じサーバー上に置かれている場合は相対パス、それ以外(GitHub Pages・
// ローカル確認)からは絶対URLで同じサーバーのAPIに繋ぐ
const SELF_HOSTS = ["tonyasan.jp", "www.tonyasan.jp", "tonya.craftfile.jp"];
const API_BASE =
  SELF_HOSTS.indexOf(location.hostname) >= 0
    ? "api/"
    : "https://tonyasan.jp/api/";
const TOKEN_KEY = "shizai-auth-token";

const auth = {
  get token() { return localStorage.getItem(TOKEN_KEY) || ""; },
  set token(v) {
    if (v) localStorage.setItem(TOKEN_KEY, v);
    else localStorage.removeItem(TOKEN_KEY);
  },
  get on() { return !!API_BASE && !!this.token; },
};

// サーバーAPIの呼び出し(ログイン切れは onAuthExpired で通知)
async function api(path, { method = "GET", json, form, raw } = {}) {
  const headers = {};
  if (auth.token) headers["Authorization"] = "Bearer " + auth.token;
  let body;
  if (json !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
  else if (form) { body = form; }
  const res = await fetch(API_BASE + path, { method, headers, body });
  if (res.status === 401) {
    const d = await res.json().catch(() => ({}));
    // ログイン操作そのものの失敗(パスワード違い)は、そのまま理由を返す
    const isLoginAttempt = json && json.action === "login";
    if (!isLoginAttempt) {
      auth.token = "";
      if (window.onAuthExpired) window.onAuthExpired();
    }
    throw new Error(d.error || (isLoginAttempt ? "ログインできませんでした" : "ログインの有効期限が切れました"));
  }
  if (raw) return res;
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error || "サーバーエラー(" + res.status + ")");
  return data;
}

// ============================================================
// iOS アプリ(Capacitor の殻)から開かれているときのネイティブ連携
//  アプリ側が window.Capacitor を注入するので、それが無ければ従来どおり Web として動く。
//  ブラウザ版の動きは一切変えない(すべての関数が「ネイティブでなければ false を返す」)。
// ============================================================
const NATIVE_APP = (() => {
  try {
    const c = window.Capacitor;
    return !!(c && typeof c.isNativePlatform === "function" && c.isNativePlatform() && typeof c.nativePromise === "function");
  } catch { return false; }
})();
const nativeCall = (plugin, method, options) => window.Capacitor.nativePromise(plugin, method, options || {});
// 文章を端末の共有シート(LINE・メール・メモなど)へ渡す。共有をやめても false にはしない
async function nativeShareText(text, title) {
  if (!NATIVE_APP) return false;
  try { await nativeCall("Share", "share", { title: title || "", text, dialogTitle: title || "共有" }); } catch (e) { /* キャンセル */ }
  return true;
}
// ブラウザの「ダウンロード」の代わりに、ファイルをアプリの一時領域へ書いて共有シートで
// 「ファイルに保存」やメール添付などができるようにする。content は文字列(JSON など)か Blob
async function nativeShareFile(filename, content, mime) {
  if (!NATIVE_APP) return false;
  try {
    let opts;
    if (typeof content === "string") {
      opts = { path: filename, data: content, directory: "CACHE", encoding: "utf8", recursive: true };
    } else {
      const b64 = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(",")[1] || "");
        fr.onerror = () => reject(fr.error);
        fr.readAsDataURL(content);
      });
      opts = { path: filename, data: b64, directory: "CACHE", recursive: true };
    }
    const w = await nativeCall("Filesystem", "writeFile", opts);
    await nativeCall("Share", "share", { title: filename, files: [w.uri], dialogTitle: filename });
  } catch (e) {
    // キャンセルは黙って戻る。それ以外だけ知らせる
    const msg = String((e && e.message) || e || "");
    if (msg && !/cancel/i.test(msg)) window.alert("ファイルを共有できませんでした: " + msg);
  }
  return true;
}
// ブラウザ向けの <a download> を、ネイティブでは共有シートに置き換える共通入口
function saveOrShareBlob(blob, filename) {
  if (NATIVE_APP) { nativeShareFile(filename, blob, blob.type); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

window.storage = {
  async get(key, shared) {
    if (auth.on) {
      const r = await api("storage.php?k=" + encodeURIComponent(key));
      return r.value == null ? null : { key, value: r.value, shared: !!shared };
    }
    const v = localStorage.getItem((shared ? "shared:" : "p:") + key);
    return v == null ? null : { key, value: v, shared: !!shared };
  },
  async set(key, value, shared) {
    if (auth.on) {
      await api("storage.php", { method: "POST", json: { k: key, v: value } });
      return { key, value, shared: !!shared };
    }
    localStorage.setItem((shared ? "shared:" : "p:") + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    if (auth.on) {
      await api("storage.php?k=" + encodeURIComponent(key), { method: "DELETE" });
      return { key, deleted: true, shared: !!shared };
    }
    localStorage.removeItem((shared ? "shared:" : "p:") + key);
    return { key, deleted: true, shared: !!shared };
  },
};

// ---------- ユーティリティ ----------
function norm(s) {
  return (s || "")
    .toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) =>
      String.fromCharCode(c.charCodeAt(0) - 0xfee0)
    )
    .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/[ー－―‐]/g, "-")
    .replace(/\s+/g, " ")
    .trim();
}

function monthsSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24 * 30.44));
}

// ---------- 原本書類の保存(IndexedDB) ----------
// 取り込んだ請求書などの PDF/画像そのものを保存する。localStorage は
// 容量が約5MBしかなく写真数枚で他のデータ保存まで壊れるため使わない。
function docDb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("shizai-docs", 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      const st = db.objectStoreNames.contains("docs")
        ? req.transaction.objectStore("docs")
        : db.createObjectStore("docs", { keyPath: "docId" });
      if (!st.indexNames.contains("invoiceId")) st.createIndex("invoiceId", "invoiceId", { unique: false });
      if (!st.indexNames.contains("hash")) st.createIndex("hash", "hash", { unique: false });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
// ファイル内容のSHA-256(重複取込の検出用)。計算できない環境では null
async function fileHash(f) {
  if (!window.crypto || !crypto.subtle) return null;
  const buf = await f.arrayBuffer();
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function docFindByHash(hash) {
  if (auth.on) {
    const r = await api("docs.php?hash=" + encodeURIComponent(hash));
    return r.exists ? { docId: r.doc_id } : null;
  }
  const db = await docDb();
  return new Promise((res, rej) => {
    const req = db.transaction("docs").objectStore("docs").index("hash").get(hash);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
}
async function docPut(doc) {
  if (auth.on) {
    const fd = new FormData();
    fd.append("file", doc.blob, doc.name);
    fd.append("doc_id", doc.docId);
    fd.append("invoice_id", doc.invoiceId);
    fd.append("name", doc.name);
    fd.append("mime", doc.mime || (doc.blob && doc.blob.type) || "");
    if (doc.hash) fd.append("hash", doc.hash);
    await api("docs.php", { method: "POST", form: fd });
    return;
  }
  const db = await docDb();
  return new Promise((res, rej) => {
    const tx = db.transaction("docs", "readwrite");
    tx.objectStore("docs").put(doc);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function docsForInvoice(invoiceId) {
  if (auth.on) {
    const r = await api("docs.php?invoice=" + encodeURIComponent(invoiceId));
    // サーバー版は本体を都度取りに行くため、閲覧用URLを持たせる
    return (r.docs || []).map((d) => ({
      docId: d.doc_id, name: d.name, mime: d.mime, size: d.size, added_at: d.added_at, remote: true,
    }));
  }
  const db = await docDb();
  return new Promise((res, rej) => {
    const req = db.transaction("docs").objectStore("docs").index("invoiceId").getAll(invoiceId);
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
// 原本ファイルの実体を取得(サーバー版はログイン確認を通してダウンロード)
async function docBlobUrl(doc) {
  if (doc.remote) {
    const res = await api("docs.php?doc=" + encodeURIComponent(doc.docId), { raw: true });
    if (!res.ok) throw new Error("書類を取得できませんでした");
    return URL.createObjectURL(await res.blob());
  }
  return URL.createObjectURL(doc.blob);
}
async function docsDeleteForInvoice(invoiceId) {
  if (auth.on) {
    await api("docs.php?invoice=" + encodeURIComponent(invoiceId), { method: "DELETE" });
    return;
  }
  const db = await docDb();
  const docs = await docsForInvoice(invoiceId);
  return new Promise((res, rej) => {
    const tx = db.transaction("docs", "readwrite");
    const st = tx.objectStore("docs");
    docs.forEach((d) => st.delete(d.docId));
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

// ---------- 以前のデータの引き継ぎ ----------
// サーバー保存に切り替える前に、このパソコンのブラウザへ保存されていた
// データをサーバーへ移すための処理。window.storage のシムを通すと
// サーバー側を読んでしまうため、ここでは localStorage と IndexedDB を
// 直接読む。
const MIGRATE_KEYS = [
  INVOICES_KEY, PRICELIST_KEY, INBOX_KEY, SETTINGS_KEY, HISTORY_KEY,
  SITES_KEY, TAGS_KEY, CART_KEY, ADDR_KEY, ORDER_TPL_KEY, ORDERS_KEY,
];

// このブラウザに残っている旧データ(キーと中身)
function legacyKvEntries() {
  const out = [];
  for (const k of MIGRATE_KEYS) {
    const v = localStorage.getItem("p:" + k);
    if (v != null) { out.push({ k, v }); continue; }
    const sv = localStorage.getItem("shared:" + k); // 共有扱いだった項目
    if (sv != null) out.push({ k, v: sv });
  }
  return out;
}

// IndexedDB に残っている原本書類(PDF・写真)をすべて取り出す
async function legacyDocsAll() {
  if (!window.indexedDB) return [];
  let db;
  try { db = await docDb(); } catch { return []; }
  return new Promise((res) => {
    try {
      const req = db.transaction("docs").objectStore("docs").getAll();
      req.onsuccess = () => res((req.result || []).filter((d) => d && d.blob));
      req.onerror = () => res([]);
    } catch { res([]); }
  });
}

// 引き継げるものがどれだけ残っているかを数える(案内の出し分け用)
async function legacyCounts() {
  const kv = legacyKvEntries();
  const docs = await legacyDocsAll();
  return { kv: kv.length, docs: docs.length, total: kv.length + docs.length };
}

// サーバー側に既にある内容と混ぜ合わせる。
// 複数のパソコンから順番に引き継ぐときに、後から来た方が
// 先に入れた分を消してしまわないようにするため。
function mergeStored(serverText, localText) {
  if (serverText == null) return localText;
  let s, l;
  try { s = JSON.parse(serverText); l = JSON.parse(localText); } catch { return serverText; }
  // 一覧(請求書・料金表・発注履歴・納品先など): id が同じものは片方だけ残す
  if (Array.isArray(s) && Array.isArray(l)) {
    const merged = s.slice();
    const known = new Set(s.map((x) => (x && x.id != null ? String(x.id) : JSON.stringify(x))));
    for (const item of l) {
      const key = item && item.id != null ? String(item.id) : JSON.stringify(item);
      if (!known.has(key)) { known.add(key); merged.push(item); }
    }
    return JSON.stringify(merged);
  }
  // 対応表(AI検索タグなど): 両方の項目を残し、重なった分はサーバー側を優先
  if (s && l && typeof s === "object" && typeof l === "object") {
    return JSON.stringify({ ...l, ...s });
  }
  return serverText; // 単一の値はサーバー側を尊重する
}

// 書類の形式。空だとサーバーに拒否されるため拡張子から補う
function docMime(d) {
  const m = (d.mime || (d.blob && d.blob.type) || "").toLowerCase();
  if (m) return m;
  const ext = (d.name || "").toLowerCase().split(".").pop();
  return { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", heic: "image/heic" }[ext] || "image/jpeg";
}

// 旧データをサーバーへ送る。onProgress で進み具合を画面に返す
async function migrateLegacyToServer(onProgress) {
  const kv = legacyKvEntries();
  const result = { kv: 0, docs: 0, failed: 0 };
  for (const { k, v } of kv) {
    onProgress("データを引き継いでいます… " + (result.kv + 1) + " / " + kv.length);
    let value = v;
    try {
      const cur = await api("storage.php?k=" + encodeURIComponent(k));
      value = mergeStored(cur.value, v);
    } catch { /* 読めない場合はこのパソコンの内容をそのまま入れる */ }
    await api("storage.php", { method: "POST", json: { k, v: value } });
    result.kv++;
  }
  const docs = await legacyDocsAll();
  for (let i = 0; i < docs.length; i++) {
    const d = docs[i];
    onProgress("書類を引き継いでいます… " + (i + 1) + " / " + docs.length);
    try {
      if (d.hash) {
        const dup = await docFindByHash(d.hash); // 同じ書類が既にあれば送らない
        if (dup) { result.docs++; continue; }
      }
      await docPut({ ...d, mime: docMime(d) });
      result.docs++;
    } catch {
      result.failed++;
    }
  }
  return result;
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("読み込み失敗"));
    r.readAsDataURL(file);
  });
}

// 大きなスキャンPDFは送信前に各ページを軽量なJPEGへ変換する
let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsPromise) {
    pdfjsPromise = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => {
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          res(window.pdfjsLib);
        } catch (e) {
          rej(e);
        }
      };
      s.onerror = () => rej(new Error("PDF変換ライブラリを読み込めませんでした"));
      document.head.appendChild(s);
    });
  }
  return pdfjsPromise;
}

async function pdfToImages(file, maxPages = 8) {
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  const pages = Math.min(doc.numPages, maxPages);
  const images = [];
  for (let i = 1; i <= pages; i++) {
    const page = await doc.getPage(i);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = Math.min(2.5, 1600 / vp1.width);
    const vp = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    images.push(canvas.toDataURL("image/jpeg", 0.8).split(",")[1]);
  }
  return { images, skipped: doc.numPages - pages };
}

function isPdfFile(f) {
  return f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");
}
function isImageFile(f) {
  return (f.type && f.type.startsWith("image/")) || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name);
}

// 写真は読み取り前に縮小・JPEG統一(容量削減 + 形式ゆれの吸収)
async function prepareFile(file, forceRaster = false) {
  if (isPdfFile(file)) {
    if (forceRaster || file.size > 1.5 * 1024 * 1024) {
      try {
        const { images, skipped } = await pdfToImages(file);
        return { name: file.name, type: "images", images, skipped };
      } catch {
        if (forceRaster) throw new Error("PDFを画像に変換できませんでした");
        // 変換できない場合はそのまま送ってみる
      }
    }
    return { name: file.name, type: "application/pdf", b64: await fileToBase64(file) };
  }
  let source = null;
  // 方式1: createImageBitmap(最も確実)
  try {
    source = await createImageBitmap(file);
  } catch {}
  // 方式2: dataURL経由のImage読み込み
  if (!source) {
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error("read"));
        r.readAsDataURL(file);
      });
      source = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error("decode"));
        i.src = dataUrl;
      });
    } catch {}
  }
  if (!source) {
    throw new Error(
      "この画像形式を読み込めませんでした。iPhoneの写真(HEIC)の場合は、写真の画面をスクリーンショットして代わりに使うか、iPhoneの 設定→カメラ→フォーマット→互換性優先 に変更して撮り直してください"
    );
  }
  const w = source.width, h = source.height;
  const max = 2200;
  const scale = Math.min(1, max / Math.max(w, h));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
  if (source.close) source.close();
  const b64 = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
  return { name: file.name, type: "image/jpeg", b64 };
}

function contentBlocksFor(prep) {
  if (prep.type === "images") {
    return prep.images.map((b) => ({
      type: "image",
      source: { type: "base64", media_type: "image/jpeg", data: b },
    }));
  }
  if (prep.type === "application/pdf") {
    return [{
      type: "document",
      source: { type: "base64", media_type: "application/pdf", data: prep.b64 },
    }];
  }
  return [{
    type: "image",
    source: { type: "base64", media_type: prep.type || "image/jpeg", data: prep.b64 },
  }];
}

// ---------- Google Gemini API(ユーザーのAPIキーで直接呼び出し) ----------
const DEFAULT_GEMINI_MODEL = "gemini-3.5-flash";
// 料金が約1/4の軽量モデル。読み取りはまずこちらで試し、失敗したら通常モデルへ
const LITE_GEMINI_MODEL = "gemini-3.5-flash-lite";

function geminiParts(prep, prompt) {
  const media =
    prep.type === "images"
      ? prep.images.map((b) => ({ inline_data: { mime_type: "image/jpeg", data: b } }))
      : [{ inline_data: { mime_type: prep.type || "image/jpeg", data: prep.b64 } }];
  return [...media, { text: prompt }];
}

async function callGemini(cfg, parts, opts = {}) {
  const model = opts.lite ? LITE_GEMINI_MODEL : (cfg && cfg.geminiModel) || DEFAULT_GEMINI_MODEL;
  const reqBody = {
    contents: [{ parts }],
    ...(opts.search ? { tools: [{ google_search: {} }] } : {}),
    generationConfig: {
      ...(opts.search ? {} : { responseMimeType: "application/json" }),
      // 読み取り系では内部の「思考」を切る(出力料金の2〜4割を占めるため)。
      // 軽量モデルはこの指定自体を受け付けない(元々思考しない)ので送らない
      ...(opts.search || opts.lite ? {} : { thinkingConfig: { thinkingBudget: 0 } }),
      maxOutputTokens: 8192,
      temperature: opts.search ? 0.3 : 0,
    },
  };
  let resp;
  // サーバー接続時はAPIキーを持つサーバーに中継させる(キーは端末に置かない)
  if (auth.on) {
    try {
      resp = await fetchRetry(API_BASE + "ai.php", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + auth.token },
        body: JSON.stringify({ provider: "gemini", model, body: reqBody }),
      });
    } catch {
      throw new Error("サーバーへの通信に失敗しました。ネットワークをご確認ください");
    }
  } else {
  try {
    resp = await fetchRetry(
      "https://generativelanguage.googleapis.com/v1beta/models/" +
        encodeURIComponent(model) +
        ":generateContent?key=" +
        encodeURIComponent(cfg.geminiKey),
      { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(reqBody) }
    );
  } catch {
    throw new Error("Geminiへの通信に失敗しました。ネットワークをご確認ください");
  }
  }
  const data = await resp.json();
  if (data.error) {
    throw new Error("Geminiエラー: " + (data.error.message || resp.status));
  }
  const cand = data.candidates && data.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || [])
    .map((pt) => pt.text || "")
    .join("");
  if (!text) {
    throw new Error(
      "Geminiから応答がありませんでした" +
        (cand && cand.finishReason ? "(" + cand.finishReason + ")" : "")
    );
  }
  return text;
}

// 応答が長さ上限で途切れた場合、続きを繰り返し取得して結合する
async function callClaude(body) {
  const base = body.messages;
  let acc = "";
  for (let i = 0; i < 8; i++) {
    const trimmed = acc.replace(/\s+$/, "");
    const msgs = trimmed ? [...base, { role: "assistant", content: trimmed }] : base;
    const { text, stop } = await callClaudeRaw({ ...body, messages: msgs });
    acc = trimmed + text;
    if (stop !== "max_tokens") break;
  }
  if (!acc) throw new Error("AIから応答がありませんでした");
  return acc;
}

function parseJson(text) {
  const clean = (text || "").replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  return JSON.parse(start >= 0 ? clean.slice(start, end + 1) : clean);
}

const CATEGORY_LINE =
  "分類は次の中から最も近い具体的なものを選ぶ: " +
  "セメント・生コン・骨材 / 石材 / 鋼材・鉄骨 / 鉄筋 / 板金 / タイル・れんが・ブロック / ガラス / 防水材 / 断熱材 / " +
  "木材 / 屋根材 / 建具 / 壁紙・内装 / 建材ボード / 左官材 / " +

  "(具体的な分類に該当しない設備品のみ 設備、どれにも当てはまらない場合のみ その他)";

// ---------- AI: 請求書明細の抽出 ----------
const ITEM_KEYMAP = {
  n: "name", mk: "maker", sp: "spec", c: "category", q: "quantity",
  u: "unit", p: "unit_price", t: "price_tax", a: "amount", m: "notes",
};
function expandItem(raw) {
  const out = {};
  for (const [k, v] of Object.entries(raw)) out[ITEM_KEYMAP[k] || k] = v;
  return out;
}
// JSONが途中で切れていても、完成している明細行だけを救い出す
function salvageInvoice(text) {
  const s = (text || "").replace(/```json|```/g, "");
  const head = (key) => {
    const m = s.match(new RegExp('"' + key + '"\\s*:\\s*"([^"]*)"'));
    return m ? m[1] : "";
  };
  const items = [];
  const arr = s.slice(s.indexOf('"items"'));
  for (const m of arr.matchAll(/\{[^{}]*\}/g)) {
    try { items.push(JSON.parse(m[0])); } catch {}
  }
  if (!items.length) return null;
  return { s: head("s"), no: head("no"), d: head("d"), items };
}
async function extractInvoice(prep, cfg) {
  const prompt = `あなたは建築工事全般の資材の請求書を読み取るアシスタントです。
対象は専門27業種(とび・土工、石、鋼構造物、鉄筋、板金、鉄骨、タイル・れんが・ブロック、ガラス、防水、熱絶縁、さく井、大工、屋根、建具、内装仕上、電気、管、電気通信、消防施設、機械器具設置、水道施設、左官、塗装、ほ装、しゅんせつ、造園、解体、清掃施設)で扱う資材すべてです。
この請求書(スキャンPDFまたはスマホ写真の場合あり。斜め・影・手ブレがあっても可能な限り読み取る)から明細を抽出し、改行なしの1行のJSONだけを返してください。前置き・コードブロック記号は一切不要です。

形式(キーは必ずこの短縮名を使う):
{"s":"仕入先名","no":"請求書番号","d":"YYYY-MM-DD","g":"現場名・工事名・件名(記載があれば。例: 山田様邸新築工事)","items":[{"n":"材料名","mk":"メーカー","sp":"規格・寸法・容量","c":"分類","q":数量,"u":"単位","p":単価,"t":"ex","a":金額,"m":"特記"}]}

ルール:
- ${CATEGORY_LINE}
- t は単価が税抜なら "ex"、税込なら "in"(判別不能は "ex")
- 不明・空欄のキーは省略する(null や空文字を書かない)
- 値引き・送料・小計・消費税の行は含めない
- 和暦は西暦に変換`;
  const useGemini = auth.on ? true : (cfg && cfg.engine === "gemini" && cfg.geminiKey);

  async function runOnce(subPrep, extraNote) {
    const fullPrompt = prompt + (extraNote || "");
    const claudeMsg = {
      messages: [
        { role: "user", content: [...contentBlocksFor(subPrep), { type: "text", text: fullPrompt }] },
      ],
    };
    // 呼び出し→解析までを1セットで行う(解析できなければ失敗扱いにして次の手へ)
    const readWith = async (call) => {
      const text = await call();
      let parsed;
      try {
        parsed = parseJson(text);
      } catch {
        parsed = salvageInvoice(text);
      }
      if (!parsed) {
        const head = (text || "").slice(0, 120).replace(/\s+/g, " ");
        throw new Error("明細の解析に失敗しました(AI応答の冒頭: " + head + " …)");
      }
      return parsed;
    };
    // 料金の安い軽量モデル → 通常モデル → Claude の順で粘る
    const attempts = [];
    if (useGemini) {
      attempts.push({ fb: false, run: () => readWith(() => callGemini(cfg, geminiParts(subPrep, fullPrompt), { lite: true })) });
      attempts.push({ fb: false, run: () => readWith(() => callGemini(cfg, geminiParts(subPrep, fullPrompt))) });
    }
    attempts.push({ fb: useGemini, run: () => readWith(() => callClaude(claudeMsg)) });
    let lastErr = null;
    for (const a of attempts) {
      try {
        return { parsed: await a.run(), fb: a.fb };
      } catch (e) {
        // 「キー未設定」の類いは前段の本当の失敗理由を隠さない
        if (!lastErr || !/未設定/.test((e && e.message) || "")) lastErr = e;
      }
    }
    throw lastErr || new Error("読み取りに失敗しました");
  }

  // ページ画像が多い場合は3ページずつに分けて送信(サイズ・時間の問題を回避)
  const BATCH = 3;
  let usedFallback = false;
  let head = { s: "", no: "", d: "", g: "" };
  let items = [];
  if (prep.type === "images" && prep.images.length > BATCH) {
    for (let i = 0; i < prep.images.length; i += BATCH) {
      const sub = { ...prep, images: prep.images.slice(i, i + BATCH) };
      const note =
        "\n\n注: これは同一請求書の " + (i + 1) + "〜" + Math.min(i + BATCH, prep.images.length) +
        " ページ目です。ヘッダ情報(s,no,d,g)は分かる範囲で記載してください。";
      const { parsed, fb } = await runOnce(sub, note);
      usedFallback = usedFallback || fb;
      head.s = head.s || parsed.s || parsed.supplier || "";
      head.no = head.no || parsed.no || parsed.invoice_no || "";
      head.d = head.d || parsed.d || parsed.invoice_date || "";
      head.g = head.g || parsed.g || "";
      items = items.concat((parsed.items || []).map(expandItem));
    }
  } else {
    const { parsed, fb } = await runOnce(prep, "");
    usedFallback = fb;
    head = {
      s: parsed.s ?? parsed.supplier ?? "",
      no: parsed.no ?? parsed.invoice_no ?? "",
      d: parsed.d ?? parsed.invoice_date ?? "",
      g: parsed.g ?? "",
    };
    items = (parsed.items || []).map(expandItem);
  }
  // 同一明細の重複(ページ跨ぎの重複読取)を除去
  const seen = new Set();
  items = items.filter((it) => {
    const k = norm(it.name) + "|" + it.unit_price + "|" + it.quantity;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return {
    supplier: head.s,
    invoice_no: head.no,
    invoice_date: head.d,
    site: head.g,
    items,
    engine_note: usedFallback,
  };
}

// ---------- AI: 検索タグの調査 ----------
// 商品をWebで調べ、商品名に含まれない成分・種別・用途のキーワードを作る。
// これを検索対象に加えることで「シリコン」でオーデフレッシュSI等がヒットする。

// 回答文の中から「tags 配列を持つJSON」を括弧の対応を数えて取り出す。
// Web検索付きの回答は前後に文章や出典が付くことが多く、単純な
// 「最初の{〜最後の}」では壊れたJSONを掴んで失敗するため。
function extractTagJson(text) {
  const s = (text || "").replace(/```json|```/g, "");
  const spans = [];
  let depth = 0, start = -1, inStr = false, esc = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (ch === "\\") esc = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') { if (depth > 0) inStr = true; continue; }
    if (ch === "{") { if (depth === 0) start = i; depth++; }
    else if (ch === "}") {
      depth--;
      if (depth === 0 && start >= 0) { spans.push(s.slice(start, i + 1)); start = -1; }
      if (depth < 0) depth = 0;
    }
  }
  for (let i = spans.length - 1; i >= 0; i--) {
    try {
      const o = JSON.parse(spans[i]);
      if (o && Array.isArray(o.tags)) return o;
    } catch {}
  }
  return null;
}

function tagPromptBody(group) {
  return `商品名: ${group.name}
メーカー: ${group.maker || "不明"}
規格: ${group.spec || "不明"}
分類: ${group.category || "不明"}

この商品の「成分・材質・種別(樹脂種別、水性/油性、鋼種、樹種 など)・規格・用途・使う工事の種類(工種)・部位・一般名称・同義語・略称」を表す検索キーワードを日本語で10〜20個挙げてください。
対象は建築工事全般の資材です(土工・鉄筋・鋼材・板金・ガラス・防水・断熱・大工・屋根・建具・内装・電気・管・通信・消防・水道・左官・塗装・舗装・造園などすべての工種)。
目的: 商品名に含まれない語でも検索でヒットさせるためです(例: 商品名に「シリコン」が無い水性シリコン塗料を「シリコン」で、品番だけのケーブルを「VVF」「電線」で見つける)。

回答の最後に次のJSONだけを1つ出力してください:
{
  "tags": ["キーワード1", "キーワード2", ...],
  "summary": "商品の一言説明(30字以内)",
  "image_url": "商品画像の直リンクURL(https で始まり .jpg/.png/.webp 等で終わる実在のURL)。確認できたものだけ。無ければ null",
  "image_source": "その画像が載っている商品ページのURL。無ければ null",
  "catalogs": [{ "title": "資料名(8字以内。例: カタログ, 色見本, 仕様書, 施工要領)", "url": "https で始まる実在のURL(PDF直リンクか資料ページ)" }]
}

catalogs は重要な順に最大3件。無ければ [] にしてください。
確証が得られない場合も、商品名・メーカー・分類から推定できる一般的な種別キーワードを tags に挙げ、summary の末尾に(推定)と付けてください。`;
}

async function fetchMaterialTags(group, cfg) {
  const webPrompt = `建築資材の社内検索システム用のキーワードを作ります。次の商品をWeb検索で徹底的に調べ、正確な情報に基づいて回答してください。
あわせて、メーカー公式サイトや商品ページに掲載されている商品画像と、電子カタログ・技術資料(カタログPDF、仕様書、色見本、施工要領書、SDS など)も探してください。
画像URL・資料URLは推測で作らず、Web検索で実際に確認できたものだけを出してください。

${tagPromptBody(group)}`;
  const litePrompt = `建築資材の社内検索システム用のキーワードを作ります。次の商品について、あなたの知識の範囲で回答してください(Web検索は不要)。
image_url と image_source は null、catalogs は確実に知っている公式資料が無ければ [] にしてください。URLの推測は禁止です。

${tagPromptBody(group)}`;
  const hasGemini = auth.on ? true : !!(cfg && cfg.geminiKey);
  const hasClaude = auth.on ? true : !!(getSavedSettings().anthropicKey || "").trim();
  // Web検索付きを優先し、失敗したらエンジン切替 → 検索なしの順で粘る
  const attempts = [];
  if (hasGemini) attempts.push(() => callGemini(cfg, [{ text: webPrompt }], { search: true }));
  if (hasClaude) attempts.push(() =>
    callClaude({ messages: [{ role: "user", content: webPrompt }], tools: [{ type: "web_search_20250305", name: "web_search" }] })
  );
  if (hasGemini) attempts.push(() => callGemini(cfg, [{ text: litePrompt }]));
  if (hasClaude) attempts.push(() => callClaude({ messages: [{ role: "user", content: litePrompt }] }));
  if (!attempts.length) {
    throw new Error("AIが未設定です。管理者にご連絡ください");
  }
  let lastErr = null;
  let parsed = null;
  for (const run of attempts) {
    try {
      const text = await run();
      parsed = extractTagJson(text);
      if (parsed && parsed.tags.length) break;
      parsed = null;
      lastErr = new Error("AIの回答からタグを読み取れませんでした");
    } catch (e) {
      lastErr = e;
    }
  }
  if (!parsed) throw lastErr || new Error("AI調査に失敗しました");
  const httpsUrl = (v) => (typeof v === "string" && /^https:\/\/\S+$/.test(v.trim()) ? v.trim() : "");
  return {
    tags: parsed.tags.map((t) => String(t).trim()).filter(Boolean).slice(0, 25),
    summary: parsed.summary || "",
    image: httpsUrl(parsed.image_url),
    image_source: httpsUrl(parsed.image_source),
    catalogs: (Array.isArray(parsed.catalogs) ? parsed.catalogs : [])
      .map((c) => ({ title: String((c && c.title) || "資料").trim().slice(0, 12), url: httpsUrl(c && c.url) }))
      .filter((c) => c.url)
      .slice(0, 3),
  };
}

// ---------- AI モード ----------
async function askAI(question, items, cfg) {
  const compact = items.slice(0, 120).map((it) => ({
    材料: it.name, メーカー: it.maker, 規格: it.spec, 分類: it.category,
    単価: it.unit_price, 購入日: it.invoice_date, 仕入先: it.supplier, 備考: it.notes,
  }));
  const prompt = `あなたは建築工事会社の積算担当を支援するアシスタントです。
以下は社内に蓄積された過去の購入明細データです。

${JSON.stringify(compact)}

このデータを根拠に、次の質問に日本語で簡潔に答えてください。データにない事は推測と明記してください。

質問: ${question}`;
  if (auth.on || (cfg && cfg.engine === "gemini" && cfg.geminiKey)) {
    const text = await callGemini(cfg, [{ text: prompt }], { search: true });
    return text;
  }
  return callClaude({ messages: [{ role: "user", content: prompt }] });
}

// ---------- データ整形 ----------
function flatten(invoices) {
  const out = [];
  for (const inv of invoices) {
    for (const it of inv.items || []) {
      out.push({
        ...it,
        supplier: inv.supplier,
        invoice_date: inv.invoice_date,
        invoice_no: inv.invoice_no,
        invoice_id: inv.id,
        site: inv.site || "",
      });
    }
  }
  return out;
}

function searchRows(rows, query, fields) {
  const tokens = norm(query).split(" ").filter(Boolean);
  if (!tokens.length) return [];
  return rows.filter((it) => {
    const hay = norm(fields.map((f) => it[f]).join(" "));
    return tokens.every((t) => hay.includes(t));
  });
}

// ---------- 五十音インデックス(電話帳方式) ----------
// norm() がカタカナ→ひらがな・全角英数→半角に揃えるので、先頭1文字で行を判定する。
// 読みが取れない漢字・記号始まりは「他」にまとめる。
const KANA_INDEX_ORDER = ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ", "英数", "他"];
const KANA_ROWS = {
  あ: "ぁあぃいぅうぇえぉおゔ",
  か: "かがきぎくぐけげこご",
  さ: "さざしじすずせぜそぞ",
  た: "ただちぢっつづてでとど",
  な: "なにぬねの",
  は: "はばぱひびぴふぶぷへべぺほぼぽ",
  ま: "まみむめも",
  や: "ゃやゅゆょよ",
  ら: "らりるれろ",
  わ: "ゎわゐゑをん",
};
function kanaIndexKey(name) {
  const c = norm(name || "").charAt(0);
  if (!c) return "他";
  if (/[a-z0-9]/.test(c)) return "英数";
  for (const k of Object.keys(KANA_ROWS)) {
    if (KANA_ROWS[k].includes(c)) return k;
  }
  return "他";
}

function groupByMaterial(items) {
  const map = new Map();
  for (const it of items) {
    const key = norm(it.name) + "|" + norm(it.maker);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  return [...map.values()].map((rows) => {
    const sorted = [...rows].sort((a, b) =>
      (b.invoice_date || "").localeCompare(a.invoice_date || "")
    );
    const prices = rows.map((r) => r.unit_price).filter((p) => p != null);
    return {
      key: norm(rows[0].name) + "|" + norm(rows[0].maker),
      name: rows[0].name,
      maker: rows[0].maker,
      spec: sorted[0].spec,
      category: sorted[0].category,
      notes: sorted.find((r) => r.notes)?.notes || "",
      latest: sorted[0],
      count: rows.length,
      min: prices.length ? Math.min(...prices) : null,
      max: prices.length ? Math.max(...prices) : null,
      rows: sorted,
      staleMonths: monthsSince(sorted[0].invoice_date),
    };
  });
}

// 料金表から一致品を探す
function matchPriceList(group, pricelists) {
  const gk = norm(group.name);
  let best = null;
  for (const pl of pricelists) {
    for (const it of pl.items || []) {
      const nk = norm(it.name);
      if (nk && (nk.includes(gk) || gk.includes(nk))) {
        const cand = { ...it, supplier: pl.supplier, effective_date: pl.effective_date || pl.received_at };
        if (!best || (cand.effective_date || "") > (best.effective_date || "")) best = cand;
      }
    }
  }
  return best;
}

function SearchBar({ value, onChange, onSubmit, onAI, autoFocus, compact, history, onPick, onRemove, taxMode, onTax }) {
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(-1); // キーボード選択中の履歴行

  // 入力中は部分一致で絞り込み、未入力なら全履歴
  const shown = useMemo(() => {
    const list = history || [];
    const v = norm(value.trim());
    return (v ? list.filter((h) => norm(h).includes(v) && h !== value) : list).slice(0, 8);
  }, [history, value]);

  const close = () => { setOpen(false); setHi(-1); };
  const pick = (h) => { close(); onPick && onPick(h); };

  return (
    <div className="relative" style={{ maxWidth: 640, width: "100%" }}>
      <div
        className={
          "flex items-center bg-white border border-gray-200 rounded-full shadow hover:shadow-md transition-shadow px-3 sm:px-4 " +
          (compact ? "h-11" : "h-12")
        }
      >
        <svg width="18" height="18" viewBox="0 0 24 24" className="text-gray-400 shrink-0">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14" />
        </svg>
        <input
          autoFocus={autoFocus}
          value={value}
          onChange={(e) => { onChange(e.target.value); setOpen(true); setHi(-1); }}
          onFocus={() => setOpen(true)}
          onBlur={close}
          onKeyDown={(e) => {
            if (e.key === "ArrowDown" && shown.length) { e.preventDefault(); setOpen(true); setHi((hi + 1) % shown.length); }
            else if (e.key === "ArrowUp" && shown.length) { e.preventDefault(); setHi((hi - 1 + shown.length) % shown.length); }
            else if (e.key === "Escape") close();
            else if (e.key === "Enter") {
              if (open && hi >= 0 && shown[hi]) pick(shown[hi]);
              else { close(); onSubmit(); }
            }
          }}
          placeholder="材料名・メーカー・性質・現場名で検索(例: 桧 KD材 / VVF 2.0 / 山田様邸)"
          className="flex-1 w-0 min-w-0 lg:min-w-[10rem] outline-none px-3 text-base bg-transparent"
        />
        {value && (
          <button onClick={() => onChange("")} className="text-gray-400 hover:text-gray-600 px-1 sm:px-2 text-lg" aria-label="クリア">×</button>
        )}
        {onAI && (
          <button onClick={onAI} className="ml-1 shrink-0 flex items-center gap-1 rounded-full px-2 py-1 text-xs sm:px-3 sm:py-1.5 sm:text-sm bg-green-50 text-green-800 hover:bg-green-100 border border-green-100">
            <span>✦</span>
            <span>AI<span className="hidden sm:inline"> モード</span></span>
          </button>
        )}
        {taxMode && onTax && (
          <div className="ml-1.5 shrink-0">
            <TaxToggle mode={taxMode} onChange={onTax} />
          </div>
        )}
      </div>

      {/* 検索履歴ドロップダウン */}
      {open && shown.length > 0 && (
        <div
          className="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-2xl shadow-md py-2 z-20 overflow-hidden"
          onMouseDown={(e) => e.preventDefault() /* クリックで input の blur を起こさない */}
        >
          {shown.map((h, i) => (
            <div
              key={h}
              onClick={() => pick(h)}
              onMouseEnter={() => setHi(i)}
              className={
                "group flex items-center gap-3 px-4 py-2 cursor-pointer text-sm " +
                (i === hi ? "bg-gray-50" : "")
              }
            >
              <svg width="16" height="16" viewBox="0 0 24 24" className="text-gray-400 shrink-0">
                <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 6.95 6.95 0 0 1-4.9-2.03l-1.42 1.42A8.95 8.95 0 0 0 13 21a9 9 0 0 0 0-18m-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z" />
              </svg>
              <span className="flex-1 truncate text-gray-700">{h}</span>
              <button
                onClick={(e) => { e.stopPropagation(); onRemove && onRemove(h); }}
                className="text-gray-300 hover:text-gray-600 px-1 text-base"
                aria-label="この履歴を削除"
                title="履歴から削除"
              >×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ログイン・新規登録画面(サーバー保存を使うとき、未ログインなら最初に出す)
function LoginScreen({ onLoggedIn }) {
  const [mode, setMode] = useState("login"); // login | signup | verify
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [company, setCompany] = useState("");
  const [person, setPerson] = useState("");
  const [phone, setPhone] = useState("");
  const [code, setCode] = useState("");
  const [signupToken, setSignupToken] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [notice, setNotice] = useState("");
  const [cooldown, setCooldown] = useState(0);

  // 再送ボタンの待ち時間(秒読み)
  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown(cooldown - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  const inputCls = "mt-1 w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base outline-none focus:border-green-600";

  const submit = async () => {
    if (!email.trim() || !password) return;
    setBusy(true);
    setErr("");
    try {
      const r = await api("auth.php", {
        method: "POST",
        json: { action: "login", email: email.trim(), password },
      });
      auth.token = r.token;
      onLoggedIn(r);
    } catch (e) {
      setErr((e && e.message) || "ログインできませんでした");
      setBusy(false);
    }
  };

  // 電話番号のかんたんな体裁確認(全角数字も数えて10〜11桁の携帯・固定電話)
  const phoneDigits = phone.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)).replace(/[^0-9]/g, "");
  const phoneOk = /^0\d{9,10}$/.test(phoneDigits);

  const startSignup = async () => {
    if (!company.trim() || !person.trim() || !phoneOk || !email.trim() || password.length < 8) return;
    setBusy(true);
    setErr("");
    try {
      let source = null;
      try { source = JSON.parse(localStorage.getItem("shizai-first-touch") || "null"); } catch {}
      const r = await api("auth.php", {
        method: "POST",
        json: { action: "signup_start", company: company.trim(), person: person.trim(), phone: phone.trim(), email: email.trim(), password, source },
      });
      setSignupToken(r.signup_token);
      setMode("verify");
      setCode("");
      setNotice("");
      setCooldown(30);
    } catch (e) {
      setErr((e && e.message) || "送信できませんでした");
    }
    setBusy(false);
  };

  const verify = async () => {
    if (code.trim().length !== 6) return;
    setBusy(true);
    setErr("");
    try {
      const r = await api("auth.php", {
        method: "POST",
        json: { action: "signup_verify", signup_token: signupToken, code: code.trim() },
      });
      auth.token = r.token;
      onLoggedIn(r);
    } catch (e) {
      setErr((e && e.message) || "確認できませんでした");
      setBusy(false);
    }
  };

  const resend = async () => {
    setBusy(true);
    setErr("");
    try {
      await api("auth.php", { method: "POST", json: { action: "signup_resend", signup_token: signupToken } });
      setNotice("確認コードを再送しました。届くまで1〜2分かかることがあります");
      setCooldown(60);
    } catch (e) {
      setErr((e && e.message) || "再送できませんでした");
    }
    setBusy(false);
  };

  const switchMode = (m) => {
    setMode(m); setErr(""); setNotice(""); setCode("");
  };

  return (
    <div className="flex flex-col items-center px-4" style={{ paddingTop: "10vh" }}>
      <Logo size="large" />
      <p className="mt-3 text-sm text-gray-500 text-center px-4">
        建築資材の価格と購入履歴をまとめて検索
      </p>

      {mode === "login" && (
        <div className="mt-8 w-full" style={{ maxWidth: 380 }}>
          <label className="text-xs text-gray-600">メールアドレス</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()} autoComplete="username" className={inputCls} />
          <label className="text-xs text-gray-600 mt-4 block">パスワード</label>
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()} autoComplete="current-password" className={inputCls} />
          {err && <div className="mt-3 text-sm text-red-600">{err}</div>}
          <button onClick={submit} disabled={busy || !email.trim() || !password}
            className="mt-5 w-full text-white bg-green-700 hover:bg-green-800 rounded-xl py-3 font-medium disabled:opacity-50"
          >{busy ? "ログイン中…" : "ログイン"}</button>
          <div className="mt-6 border-t border-gray-100 pt-5 text-center">
            <p className="text-sm text-gray-500">はじめてご利用の会社の方は</p>
            <button onClick={() => switchMode("signup")}
              className="mt-2 w-full text-green-800 bg-green-50 hover:bg-green-100 border border-green-200 rounded-xl py-3 font-medium"
            >新規登録(無料)</button>
          </div>
          <p className="mt-5 text-xs text-gray-400 leading-relaxed">
            データは会社ごとにサーバーへ保存され、社内の全員で共有されます。

function ReferralShare({ account, onClose }) {

  const copy = async () => {

      await navigator.clipboard.writeText(text);
      setCopied(true);

      ta.value = text;
      document.body.appendChild(ta);
      ta.select();

      document.body.removeChild(ta);
      setCopied(true);

  return (
    <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 overflow-y-auto" onClick={onClose}>

// 納品先住所の入力欄。フォーカスすると過去に使った住所がドロップダウンで出る
function AddressInput({ value, onChange, history, onRemove, placeholder }) {
  const [open, setOpen] = useState(false);
  const shown = useMemo(() => {
    const list = history || [];
    const v = norm((value || "").trim());
    return (v ? list.filter((h) => norm(h).includes(v) && h !== value) : list).slice(0, 5);
  }, [history, value]);
  const close = () => setOpen(false);
  return (
    <div className="relative">
      <input
        value={value}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={close}
        onKeyDown={(e) => { if (e.key === "Escape") close(); }}
        placeholder={placeholder}
        className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-base sm:text-sm outline-none focus:border-green-600"
      />
      {open && shown.length > 0 && (
        <div
          className="absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-xl shadow-md py-1.5 z-30 overflow-hidden"
          onMouseDown={(e) => e.preventDefault() /* クリックで input の blur を起こさない */}
        >
          {shown.map((h) => (
            <div
              key={h}
              onClick={() => { onChange(h); close(); }}
              className="flex items-center gap-2.5 px-3 py-2 cursor-pointer text-sm hover:bg-gray-50"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" className="text-gray-400 shrink-0">
                <path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 6.95 6.95 0 0 1-4.9-2.03l-1.42 1.42A8.95 8.95 0 0 0 13 21a9 9 0 0 0 0-18m-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z" />
              </svg>
              <span className="flex-1 truncate text-gray-700">{h}</span>
              <button
                onClick={(e) => { e.stopPropagation(); onRemove && onRemove(h); }}
                className="text-gray-300 hover:text-gray-600 px-1"
                aria-label="この履歴を削除"
                title="履歴から削除"
              >×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function UploadStatus({ jobs, onRetry, onClear }) {
  if (!jobs.length) return null;
  const active = jobs.filter((j) => j.status === "working" || j.status === "queued").length;
  const done = jobs.filter((j) => j.status === "done" || j.status === "dup").length;
  const errors = jobs.filter((j) => j.status === "error").length;
  return (
    <div className="w-full max-w-xl mt-6 space-y-2">
      <div className="flex items-center gap-3 text-xs px-1">
        {active > 0 ? (
          <span className="text-green-700">
            読み取り中… 残り {active} 件 — 待たずに次のファイルを追加できます
          </span>
        ) : (
          <span className="text-gray-500">
            読み取り完了{errors > 0 ? "(失敗 " + errors + " 件)" : ""}
          </span>
        )}
        {active === 0 && done > 0 && onClear && (
          <button onClick={onClear} className="ml-auto text-gray-400 hover:text-gray-600 underline shrink-0">完了分を消す</button>
        )}
      </div>
      {jobs.map((j) => (
        <div key={j.id} className="flex items-center gap-3 text-sm bg-white border border-gray-200 rounded-lg px-4 py-2.5 shadow-sm">
          <span className="text-lg">📄</span>
          <span className="flex-1 truncate">{j.name}</span>
          {j.status === "queued" && <span className="text-gray-400">順番待ち</span>}
          {j.status === "working" && <span className="text-green-700 animate-pulse">読取中…</span>}
          {j.status === "done" && (
            <span className="text-green-700">
              ✓ {j.count}件を{j.merged ? "同じ請求書に追記" : "登録"}
              {j.note && <span className="text-amber-600">({j.note})</span>}
            </span>
          )}
          {j.status === "dup" && <span className="text-amber-600">登録済のためスキップ</span>}
          {j.status === "error" && (
            <>
              <span className="text-red-600 flex-1">読取失敗{j.message ? ` — ${j.message}` : ""}</span>
              {onRetry && (
                <button
                  onClick={() => onRetry(j.id)}
                  className="shrink-0 text-xs text-white bg-red-500 hover:bg-red-600 rounded-full px-3 py-1"
                >再試行</button>
              )}
            </>
          )}
        </div>
      ))}
    </div>
  );
}

function inflationSummary(pred, lastPrice) {
  if (!pred || !pred.ok) return null;
  const rl = Number(pred.rate_low), rh = Number(pred.rate_high);
  const pl = Number(pred.predicted_low), ph = Number(pred.predicted_high);
  if ([rl, rh].some(isNaN)) return null;
  const rate = Math.round((rl + rh) / 2);
  let diff = null;
  if (![pl, ph].some(isNaN) && lastPrice != null) {
    diff = Math.round((pl + ph) / 2 - Number(lastPrice));
  }
  return { rate, diff };
}

    </span>
  );
}

  // それも無いものは合計に入れず件数だけ知らせる。税表示の切替に追従する。
  const monthlyCosts = useMemo(() => {
    const conv = (n, t) => {
      let v = Number(n);
      if (taxMode === "in" && t !== "in") v = v * (1 + TAX_RATE);
      if (taxMode === "ex" && t === "in") v = v / (1 + TAX_RATE);
      return v;
    };
    const map = new Map(); // "YYYY-MM" -> 集計
    let noDate = 0;
    for (const it of allItems) {
      const m = String(it.invoice_date || "").slice(0, 7);
      if (!/^\d{4}-\d{2}$/.test(m)) { noDate++; continue; }
      if (!map.has(m)) map.set(m, { month: m, total: 0, count: 0, noAmount: 0, byCategory: new Map(), bySupplier: new Map() });
      const g = map.get(m);
      let a = it.amount;
      if (a == null && it.unit_price != null && it.quantity != null) a = it.unit_price * it.quantity;
      if (a == null || isNaN(Number(a))) { g.noAmount++; continue; }
      const v = conv(a, it.price_tax);
      g.total += v;
      g.count++;
      const cat = (it.category || "").trim() || "分類なし";
      if (!g.byCategory.has(cat)) g.byCategory.set(cat, { total: 0, byItem: new Map() });
      const c = g.byCategory.get(cat);
      c.total += v;

  // ---------- 請求書取込 ----------

  // (並行処理すると保存の競合や同一請求書の統合漏れが起きるため直列)
  const fileQueueRef = useRef([]);
  const processingRef = useRef(false);
  const handleFiles = useCallback(async (fileList) => {
    const files = [...fileList].filter((f) => isPdfFile(f) || isImageFile(f));
    if (!files.length) return;
    for (const f of files) {
      const jobId = Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "-" + f.name;
      fileQueueRef.current.push({ jobId, f });
      setJobs((j) => [...j, { id: jobId, name: f.name, status: "queued" }]);
    }
    if (processingRef.current) return; // 稼働中のループが追加分も順に処理する
    processingRef.current = true;
    let current = (await sget(INVOICES_KEY)) || [];
    try {
    while (fileQueueRef.current.length) {
      const { jobId, f } = fileQueueRef.current.shift();
      setJobs((j) => j.map((x) => (x.id === jobId ? { ...x, status: "working" } : x)));
      try {
        if (f.size > 40 * 1024 * 1024) {
          throw new Error("40MBを超えています。ファイルを分割してください");
        }
        // 同じファイル(内容が完全一致)を取込済ならスキップ
        const hash = await fileHash(f).catch(() => null);
        if (hash) {
          const dup = await docFindByHash(hash).catch(() => null);
          if (dup) {
            setJobs((j) => j.map((x) => (x.id === jobId ? { ...x, status: "dup" } : x)));
            continue;
          }
        }
        let prep = await prepareFile(f);
        let parsed;
        try {
          parsed = await extractInvoice(prep, engineCfg);
        } catch (e) {
          // 素のPDF送信で通信に失敗した場合、画像に変換して一度だけ再挑戦
          if (prep.type === "application/pdf" && /通信に失敗/.test((e && e.message) || "")) {
            prep = await prepareFile(f, true);
            parsed = await extractInvoice(prep, engineCfg);
          } else {
            throw e;
          }
        }
        if (prep.skipped > 0) {
          parsed.page_note = "先頭8ページのみ読取(残り" + prep.skipped + "ページ)";
        }
        const sig = norm(parsed.supplier) + "|" + (parsed.invoice_no || "") + "|" + (parsed.invoice_date || "");
        // 同じ請求書(番号一致)が既にある場合: スキップではなく明細を統合
        // (複数ページを写真で分けて撮った場合に対応)
        const existing = parsed.invoice_no
          ? current.find((inv) => inv.sig === sig)
          : null;
        if (existing) {
          // 追加ページも同じ請求書の原本として保存(失敗しても取込は続行)
          try {
            await docPut({ docId: jobId, invoiceId: existing.id, name: f.name, mime: f.type, blob: f, hash, added_at: new Date().toISOString() });
          } catch {}
          const seen = new Set(
            existing.items.map((it) => norm(it.name) + "|" + it.unit_price + "|" + it.quantity)
          );
          const fresh = (parsed.items || []).filter(
            (it) => it.name && !seen.has(norm(it.name) + "|" + it.unit_price + "|" + it.quantity)
          );
          if (!fresh.length) {
            setJobs((j) => j.map((x) => (x.id === jobId ? { ...x, status: "dup" } : x)));
            continue;
          }
          current = current.map((inv) =>
            inv.sig === sig
              ? { ...inv, items: [...inv.items, ...fresh], site: inv.site || parsed.site || "" }
              : inv
          );
          await sset(INVOICES_KEY, current);
          setInvoices(current);
          setJobs((j) =>
            j.map((x) =>
              x.id === jobId
                ? {
                    ...x, status: "done", count: fresh.length, merged: true,
                    note: [parsed.engine_note ? "Gemini不調のためClaudeで読取" : "", parsed.page_note || ""].filter(Boolean).join("・"),
                  }
                : x
            )
          );
          continue;
        }
        const record = {
          id: jobId, sig, file: f.name,
          supplier: parsed.supplier || "不明な仕入先",
          invoice_no: parsed.invoice_no || "",
          invoice_date: parsed.invoice_date || "",
          site: parsed.site || "",
          items: (parsed.items || []).filter((it) => it.name),
          added_at: new Date().toISOString(),
        };
        // 原本ファイルを保存(失敗しても取込は続行)
        try {
          await docPut({ docId: jobId, invoiceId: record.id, name: f.name, mime: f.type, blob: f, hash, added_at: record.added_at });
        } catch {}
        current = [...current, record];
        await sset(INVOICES_KEY, current);
        setInvoices(current);
        setJobs((j) =>
          j.map((x) =>
            x.id === jobId
              ? {
                  ...x, status: "done", count: record.items.length,
                  note: [parsed.engine_note ? "Gemini不調のためClaudeで読取" : "", parsed.page_note || ""].filter(Boolean).join("・"),
                }
              : x
          )
        );
      } catch (e) {
        failedFilesRef.current[jobId] = f;
        let msg = (e && e.message) || "";
        if (/通信に失敗/.test(msg)) {
          // ファイルの問題か、環境の問題かを極小リクエストで判定
          const alive = await probeClaude();
          msg = alive
            ? "送信できましたがこのファイルの処理中に接続が切れました。数分おいて「再試行」を押してください。続く場合はPDFを数ページずつに分けてください"
            : ENV_BLOCK_MSG;
        }
        setJobs((j) =>
          j.map((x) =>
            x.id === jobId
              ? { ...x, status: "error", message: msg }
              : x
          )
        );
      }
    }
    } finally {
      processingRef.current = false;
    }
    // 新しい資材の検索タグを裏で調査(失敗しても取込には影響しない)
    if (autoTagRef.current) autoTagRef.current(current);

  const buildOrderText = () => {

    const itemLines =
      order.items.length === 1

        : [

    const lines = [

                  </div>
                ) : (
                  <div className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 leading-relaxed">
                    納品先が未登録です。データ管理の「納品先の登録」から倉庫・会社の住所を登録すると、ここで選べるようになります。
                  </div>
                )
              ) : (
                <div>
                  <label className="text-xs text-gray-600">
                    {order.place === "現場" ? "現場の住所・名称" : "納品先の住所"}
                    {addrHistory.length > 0 && <span className="text-gray-400 ml-1.5">(クリックで履歴から選べます)</span>}
                  </label>
                  <AddressInput
                    value={order.address}
                    onChange={(v) => setOrder({ ...order, address: v, customText: null, copied: false })}
                    history={addrHistory}
                    onRemove={removeAddr}
                    placeholder="例: 〇〇市〇〇町1-2-3 〇〇様邸"
                  />
                </div>
              )}
              <div>
                <div className="flex items-center gap-2">
                  <label className="text-xs text-gray-600 flex-1">
                    依頼文(そのまま編集できます)
                  </label>
                  {order.customText != null && (
                    <button
                      onClick={() => setOrder({ ...order, customText: null, copied: false })}
                      className="text-xs text-gray-500 border border-gray-200 hover:bg-gray-50 rounded-full px-2.5 py-0.5"
                      title="手で直した内容を破棄して自動作成し直します"
                    >自動作成に戻す</button>
                  )}
                </div>
                <textarea
                  value={orderText}
                  onChange={(e) => setOrder({ ...order, customText: e.target.value, copied: false })}
                  rows={10}
                  className="mt-1 w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-base sm:text-xs leading-relaxed outline-none focus:border-green-600 focus:bg-white"
                  style={{ fontFamily: "inherit", resize: "vertical" }}
                />
                {order.customText != null && (
                  <div className="text-xs text-amber-700 mt-1">
                    手で編集した文面を送ります。数量や納品場所を変えると自動作成に戻ります。
                  </div>
                )}
              </div>
              <div className="flex flex-wrap gap-2 pt-1">
                <button
                  onClick={copyOrder}
                  disabled={!orderValid}
                  className="text-sm text-white bg-green-700 hover:bg-green-800 rounded-full px-4 py-2 disabled:opacity-50"
                >依頼文をコピー</button>
                <button
                  onClick={lineOrder}
                  disabled={!orderValid}
                  className="text-sm text-white rounded-full px-4 py-2 disabled:opacity-50"
                  style={{ background: "#06C755" }}
                >LINEで送る</button>
                {NATIVE_APP && (
                  <button
                    onClick={shareOrder}
                    disabled={!orderValid}
                    className="text-sm text-green-800 border border-green-300 hover:bg-green-50 rounded-full px-4 py-2 disabled:opacity-50"
                  >共有…</button>
                )}
                <button
                  onClick={mailOrder}
                  disabled={!orderValid}
                  className="text-sm text-green-800 border border-green-300 hover:bg-green-50 rounded-full px-4 py-2 disabled:opacity-50"
                >メールで送る</button>
                <button
                  onClick={() => setOrder(null)}
                  className="text-sm text-gray-600 border border-gray-200 hover:bg-gray-50 rounded-full px-4 py-2"
                >閉じる</button>
              </div>
              {orderLogMsg && (
                <div className="text-green-700 text-xs">
                  ✓ 発注履歴に追加されました。{order.mode === "cart" && "発注した品目はカートから外しました。"}
                </div>
              )}
              {order.copied && (
                <div className="text-green-700 text-xs">✓ コピーしました。LINEやメールに貼り付けて送信できます。</div>
              )}
              <div className="text-xs text-gray-400 leading-relaxed">
                「LINEで送る」はスマホでLINEアプリの共有画面が開きます(パソコンではコピーしてお使いください)。メールは宛先を入れてから送信してください。
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ================= 原本ビューア ================= */}
      {docView && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={closeDocs}>
          <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[88vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center gap-3 px-5 py-3 border-b border-gray-100">
              <span className="text-lg">📄</span>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium truncate">{docView.invoice.supplier}</div>
                <div className="text-xs text-gray-500">
                  {fmtDate(docView.invoice.invoice_date)} ・ {docView.docs.length} ファイル
                </div>
              </div>
              <button
                onClick={closeDocs}
                className="text-sm text-gray-600 border border-gray-200 hover:bg-gray-50 rounded-full px-4 py-1.5 shrink-0"
              >閉じる</button>
            </div>
            <div className="overflow-auto p-4 space-y-6">
              {docView.docs.map((d, i) => (
                <div key={i}>
                  <div className="text-xs text-gray-500 mb-1.5 truncate">{d.name}</div>
                  {(d.mime || "").includes("pdf") ? (
                    <iframe src={d.url} title={d.name} className="w-full border border-gray-200 rounded-lg" style={{ height: "70vh" }} />
                  ) : (
                    <img src={d.url} alt={d.name} className="max-w-full rounded-lg border border-gray-200" />
                  )}
                  {NATIVE_APP ? (
                    <button
                      onClick={async () => {
                        try {
                          const blob = await (await fetch(d.url)).blob();
                          nativeShareFile(d.name || "書類", blob, d.mime || blob.type);
                        } catch (e) {
                          window.alert("書類を取り出せませんでした: " + ((e && e.message) || ""));
                        }
                      }}
                      className="inline-block mt-1.5 text-xs text-green-800 hover:underline"
                    >共有・保存…</button>
                  ) : (
                    <a href={d.url} download={d.name} className="inline-block mt-1.5 text-xs text-green-800 hover:underline">ダウンロード</a>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* フッター(トップのみ・仕入先向けリンク) */}
      {view === "home" && (
        <div
          className="fixed bottom-0 inset-x-0 flex items-center justify-center text-xs py-2 bg-white border-t border-gray-50"
          style={{ paddingBottom: "calc(0.5rem + env(safe-area-inset-bottom))" }}
        >
          <button onClick={() => { setSupDone(null); go("supplier"); }} className="text-green-700 hover:underline">
            仕入先の方はこちら(料金表アップロード)
          </button>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<ShizaiSearch />);

</script>
</body>
</html>
