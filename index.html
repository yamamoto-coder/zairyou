window.storage = {
  async get(key, shared) {
    const v = localStorage.getItem((shared ? "shared:" : "p:") + key);
    return v == null ? null : { key, value: v, shared: !!shared };
  },
  async set(key, value, shared) {
    localStorage.setItem((shared ? "shared:" : "p:") + key, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    localStorage.removeItem((shared ? "shared:" : "p:") + key);
    return { key, deleted: true, shared: !!shared };
  },
};

function norm(s) {
  return (s || "")
    .toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) =>
      String.fromCharCode(c.charCodeAt(0) - 0xfee0)

    .replace(/[ー－―‐]/g, "-")
    .replace(/\s+/g, " ")

}

function monthsSince(dateStr) {
  if (!dateStr) return null;

// ---------- 原本書類の保存(IndexedDB) ----------
// 取り込んだ請求書などの PDF/画像そのものを保存する。localStorage は
// 容量が約5MBしかなく写真数枚で他のデータ保存まで壊れるため使わない。
function docDb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("shizai-docs", 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      const st = db.objectStoreNames.contains("docs")
        ? req.transaction.objectStore("docs")
        : db.createObjectStore("docs", { keyPath: "docId" });
      if (!st.indexNames.contains("invoiceId")) st.createIndex("invoiceId", "invoiceId", { unique: false });
      if (!st.indexNames.contains("hash")) st.createIndex("hash", "hash", { unique: false });
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
// ファイル内容のSHA-256(重複取込の検出用)。計算できない環境では null
async function fileHash(f) {
  if (!window.crypto || !crypto.subtle) return null;
  const buf = await f.arrayBuffer();
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
async function docFindByHash(hash) {
  const db = await docDb();
  return new Promise((res, rej) => {
    const req = db.transaction("docs").objectStore("docs").index("hash").get(hash);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
}
async function docPut(doc) {
  const db = await docDb();
  return new Promise((res, rej) => {
    const tx = db.transaction("docs", "readwrite");
    tx.objectStore("docs").put(doc);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function docsForInvoice(invoiceId) {
  const db = await docDb();
  return new Promise((res, rej) => {
    const req = db.transaction("docs").objectStore("docs").index("invoiceId").getAll(invoiceId);
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function docsDeleteForInvoice(invoiceId) {
  const db = await docDb();
  const docs = await docsForInvoice(invoiceId);
  return new Promise((res, rej) => {
    const tx = db.transaction("docs", "readwrite");
    const st = tx.objectStore("docs");
    docs.forEach((d) => st.delete(d.docId));
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("読み込み失敗"));
    r.readAsDataURL(file);
  });
}

// 大きなスキャンPDFは送信前に各ページを軽量なJPEGへ変換する
let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsPromise) {
    pdfjsPromise = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      s.onload = () => {
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          res(window.pdfjsLib);
        } catch (e) {
          rej(e);
        }
      };
      s.onerror = () => rej(new Error("PDF変換ライブラリを読み込めませんでした"));
      document.head.appendChild(s);
    });
  }
  return pdfjsPromise;
}

async function pdfToImages(file, maxPages = 8) {
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await pdfjs.getDocument({ data: buf }).promise;
  const pages = Math.min(doc.numPages, maxPages);
  const images = [];
  for (let i = 1; i <= pages; i++) {
    const page = await doc.getPage(i);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = Math.min(2.5, 1600 / vp1.width);
    const vp = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    images.push(canvas.toDataURL("image/jpeg", 0.8).split(",")[1]);
  }
  return { images, skipped: doc.numPages - pages };
}

function isPdfFile(f) {
  return f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");
}
function isImageFile(f) {
  return (f.type && f.type.startsWith("image/")) || /\.(jpe?g|png|webp|gif|bmp|heic|heif)$/i.test(f.name);
}

// 写真は読み取り前に縮小・JPEG統一(容量削減 + 形式ゆれの吸収)
async function prepareFile(file, forceRaster = false) {
  if (isPdfFile(file)) {
    if (forceRaster || file.size > 1.5 * 1024 * 1024) {
      try {
        const { images, skipped } = await pdfToImages(file);
        return { name: file.name, type: "images", images, skipped };
      } catch {
        if (forceRaster) throw new Error("PDFを画像に変換できませんでした");
        // 変換できない場合はそのまま送ってみる
      }
    }
    return { name: file.name, type: "application/pdf", b64: await fileToBase64(file) };
  }
  let source = null;
  // 方式1: createImageBitmap(最も確実)
  try {
    source = await createImageBitmap(file);
  } catch {}
  // 方式2: dataURL経由のImage読み込み
  if (!source) {
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(new Error("read"));
        r.readAsDataURL(file);
      });
      source = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = () => rej(new Error("decode"));
        i.src = dataUrl;
      });
    } catch {}
  }
  if (!source) {
    throw new Error(
      "この画像形式を読み込めませんでした。iPhoneの写真(HEIC)の場合は、写真の画面をスクリーンショットして代わりに使うか、iPhoneの 設定→カメラ→フォーマット→互換性優先 に変更して撮り直してください"
    );
  }
  const w = source.width, h = source.height;
  const max = 2200;
  const scale = Math.min(1, max / Math.max(w, h));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  canvas.getContext("2d").drawImage(source, 0, 0, canvas.width, canvas.height);
  if (source.close) source.close();
  const b64 = canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
  return { name: file.name, type: "image/jpeg", b64 };
}

function contentBlocksFor(prep) {
  if (prep.type === "images") {
    return prep.images.map((b) => ({
      type: "image",
      source: { type: "base64", media_type: "image/jpeg", data: b },
    }));
  }
  if (prep.type === "application/pdf") {
    return [{
      type: "document",
      source: { type: "base64", media_type: "application/pdf", data: prep.b64 },
    }];
  }
  return [{
    type: "image",
    source: { type: "base64", media_type: prep.type || "image/jpeg", data: prep.b64 },
  }];
}

async function fetchRetry(url, opts) {
  let lastErr;
  for (let i = 0; i < 3; i++) {
    try {
      return await fetch(url, opts);
    } catch (e) {
      lastErr = e;
      await new Promise((r) => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw lastErr;
}

async function callClaudeRaw(body) {
  const akey = (getSavedSettings().anthropicKey || "").trim();
  if (!akey) {
    throw new Error(
      "このパソコンではAI読み取りがまだ設定されていません。設定は管理者が行いますので、管理者にご連絡ください"
    );
  }
  let response;
  try {
    response = await fetchRetry("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": akey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 4000, ...body }),
    });
  } catch {
    throw new Error(
      "通信に失敗しました(3回試行)。ファイルが大きい場合はスキャン解像度を下げるか、時間をおいて「再試行」を押してください"
    );
  }
  const data = await response.json();
  if (data.error) {
    throw new Error("AIエラー: " + (data.error.message || JSON.stringify(data.error)));
  }
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("");
  return { text, stop: data.stop_reason };
}

// ---------- Google Gemini API(ユーザーのAPIキーで直接呼び出し) ----------
const DEFAULT_GEMINI_MODEL = "gemini-3.5-flash";

function geminiParts(prep, prompt) {
  const media =
    prep.type === "images"
      ? prep.images.map((b) => ({ inline_data: { mime_type: "image/jpeg", data: b } }))
      : [{ inline_data: { mime_type: prep.type || "image/jpeg", data: prep.b64 } }];
  return [...media, { text: prompt }];
}

async function callGemini(cfg, parts, opts = {}) {
  const model = cfg.geminiModel || DEFAULT_GEMINI_MODEL;
  let resp;
  try {
    resp = await fetchRetry(
      "https://generativelanguage.googleapis.com/v1beta/models/" +
        encodeURIComponent(model) +
        ":generateContent?key=" +
        encodeURIComponent(cfg.geminiKey),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts }],
          ...(opts.search ? { tools: [{ google_search: {} }] } : {}),
          generationConfig: {
            ...(opts.search ? {} : { responseMimeType: "application/json" }),
            maxOutputTokens: 8192,
            temperature: opts.search ? 0.3 : 0,
          },
        }),
      }
    );
  } catch {
    throw new Error("Geminiへの通信に失敗しました。ネットワークをご確認ください");
  }
  const data = await resp.json();
  if (data.error) {
    throw new Error("Geminiエラー: " + (data.error.message || resp.status));
  }
  const cand = data.candidates && data.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || [])
    .map((pt) => pt.text || "")
    .join("");
  if (!text) {
    throw new Error(
      "Geminiから応答がありませんでした" +
        (cand && cand.finishReason ? "(" + cand.finishReason + ")" : "")
    );
  }
  return text;
}

// 応答が長さ上限で途切れた場合、続きを繰り返し取得して結合する
async function callClaude(body) {
  const base = body.messages;
  let acc = "";
  for (let i = 0; i < 8; i++) {
    const trimmed = acc.replace(/\s+$/, "");
    const msgs = trimmed ? [...base, { role: "assistant", content: trimmed }] : base;
    const { text, stop } = await callClaudeRaw({ ...body, messages: msgs });
    acc = trimmed + text;
    if (stop !== "max_tokens") break;
  }
  if (!acc) throw new Error("AIから応答がありませんでした");
  return acc;
}

function parseJson(text) {
  const clean = (text || "").replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  const end = clean.lastIndexOf("}");
  return JSON.parse(start >= 0 ? clean.slice(start, end + 1) : clean);
}

const ITEM_KEYMAP = {
  n: "name", mk: "maker", sp: "spec", c: "category", q: "quantity",
  u: "unit", p: "unit_price", t: "price_tax", a: "amount", m: "notes",

// JSONが途中で切れていても、完成している明細行だけを救い出す
function salvageInvoice(text) {
  const s = (text || "").replace(/```json|```/g, "");
  const head = (key) => {
    const m = s.match(new RegExp('"' + key + '"\\s*:\\s*"([^"]*)"'));
    return m ? m[1] : "";
  };
  const items = [];
  const arr = s.slice(s.indexOf('"items"'));
  for (const m of arr.matchAll(/\{[^{}]*\}/g)) {
    try { items.push(JSON.parse(m[0])); } catch {}
  }
  if (!items.length) return null;
  return { s: head("s"), no: head("no"), d: head("d"), items };
}
async function extractInvoice(prep, cfg) {
  const prompt = `あなたは建築工事全般の資材の請求書を読み取るアシスタントです。
対象は専門27業種(とび・土工、石、鋼構造物、鉄筋、板金、鉄骨、タイル・れんが・ブロック、ガラス、防水、熱絶縁、さく井、大工、屋根、建具、内装仕上、電気、管、電気通信、消防施設、機械器具設置、水道施設、左官、塗装、ほ装、しゅんせつ、造園、解体、清掃施設)で扱う資材すべてです。
この請求書(スキャンPDFまたはスマホ写真の場合あり。斜め・影・手ブレがあっても可能な限り読み取る)から明細を抽出し、改行なしの1行のJSONだけを返してください。前置き・コードブロック記号は一切不要です。

形式(キーは必ずこの短縮名を使う):

ルール:

- 不明・空欄のキーは省略する(null や空文字を書かない)
- 値引き・送料・小計・消費税の行は含めない
- 和暦は西暦に変換`;
  const useGemini = cfg && cfg.engine === "gemini" && cfg.geminiKey;

  async function runOnce(subPrep, extraNote) {
    const fullPrompt = prompt + (extraNote || "");
    const claudeMsg = {
      messages: [
        { role: "user", content: [...contentBlocksFor(subPrep), { type: "text", text: fullPrompt }] },
      ],
    };
    let text;
    let fb = false;
    if (useGemini) {
      try {
        text = await callGemini(cfg, geminiParts(subPrep, fullPrompt));
      } catch {
        fb = true;
        text = await callClaude(claudeMsg);
      }
    } else {
      text = await callClaude(claudeMsg);
    }
    let parsed;
    try {
      parsed = parseJson(text);
    } catch {
      parsed = salvageInvoice(text);
      if (!parsed) {
        const head = (text || "").slice(0, 120).replace(/\s+/g, " ");
        throw new Error("明細の解析に失敗しました(AI応答の冒頭: " + head + " …)");
      }
    }
    return { parsed, fb };
  }

  // ページ画像が多い場合は3ページずつに分けて送信(サイズ・時間の問題を回避)
  const BATCH = 3;
  let usedFallback = false;
  let head = { s: "", no: "", d: "", g: "" };
  let items = [];
  if (prep.type === "images" && prep.images.length > BATCH) {
    for (let i = 0; i < prep.images.length; i += BATCH) {
      const sub = { ...prep, images: prep.images.slice(i, i + BATCH) };
      const note =
        "\n\n注: これは同一請求書の " + (i + 1) + "〜" + Math.min(i + BATCH, prep.images.length) +
        " ページ目です。ヘッダ情報(s,no,d,g)は分かる範囲で記載してください。";
      const { parsed, fb } = await runOnce(sub, note);
      usedFallback = usedFallback || fb;
      head.s = head.s || parsed.s || parsed.supplier || "";
      head.no = head.no || parsed.no || parsed.invoice_no || "";
      head.d = head.d || parsed.d || parsed.invoice_date || "";
      head.g = head.g || parsed.g || "";
      items = items.concat((parsed.items || []).map(expandItem));
    }
  } else {
    const { parsed, fb } = await runOnce(prep, "");
    usedFallback = fb;
    head = {
      s: parsed.s ?? parsed.supplier ?? "",
      no: parsed.no ?? parsed.invoice_no ?? "",
      d: parsed.d ?? parsed.invoice_date ?? "",
      g: parsed.g ?? "",
    };
    items = (parsed.items || []).map(expandItem);
  }
  // 同一明細の重複(ページ跨ぎの重複読取)を除去
  const seen = new Set();
  items = items.filter((it) => {
    const k = norm(it.name) + "|" + it.unit_price + "|" + it.quantity;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return {
    supplier: head.s,
    invoice_no: head.no,
    invoice_date: head.d,
    site: head.g,
    items,
    engine_note: usedFallback,
  };
}

// ---------- AI: 検索タグの調査 ----------
// 商品をWebで調べ、商品名に含まれない成分・種別・用途のキーワードを作る。
// これを検索対象に加えることで「シリコン」でオーデフレッシュSI等がヒットする。

// 回答文の中から「tags 配列を持つJSON」を括弧の対応を数えて取り出す。
// Web検索付きの回答は前後に文章や出典が付くことが多く、単純な
// 「最初の{〜最後の}」では壊れたJSONを掴んで失敗するため。
function extractTagJson(text) {
  const s = (text || "").replace(/```json|```/g, "");
  const spans = [];
  let depth = 0, start = -1, inStr = false, esc = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inStr) {
      if (esc) esc = false;
      else if (ch === "\\") esc = true;
      else if (ch === '"') inStr = false;
      continue;
    }
    if (ch === '"') { if (depth > 0) inStr = true; continue; }
    if (ch === "{") { if (depth === 0) start = i; depth++; }
    else if (ch === "}") {
      depth--;
      if (depth === 0 && start >= 0) { spans.push(s.slice(start, i + 1)); start = -1; }
      if (depth < 0) depth = 0;
    }
  }
  for (let i = spans.length - 1; i >= 0; i--) {
    try {
      const o = JSON.parse(spans[i]);
      if (o && Array.isArray(o.tags)) return o;
    } catch {}
  }
  return null;
}

async function fetchMaterialTags(group, cfg) {
  const webPrompt = `建築資材の社内検索システム用のキーワードを作ります。次の商品をWeb検索で徹底的に調べ、正確な情報に基づいて回答してください。

${tagPromptBody(group)}`;
  const litePrompt = `建築資材の社内検索システム用のキーワードを作ります。次の商品について、あなたの知識の範囲で回答してください(Web検索は不要)。
image_url と image_source は null、catalogs は確実に知っている公式資料が無ければ [] にしてください。URLの推測は禁止です。

${tagPromptBody(group)}`;
  const hasGemini = !!(cfg && cfg.geminiKey);
  const hasClaude = !!(getSavedSettings().anthropicKey || "").trim();
  // Web検索付きを優先し、失敗したらエンジン切替 → 検索なしの順で粘る
  const attempts = [];
  if (hasGemini) attempts.push(() => callGemini(cfg, [{ text: webPrompt }], { search: true }));
  if (hasClaude) attempts.push(() =>
    callClaude({ messages: [{ role: "user", content: webPrompt }], tools: [{ type: "web_search_20250305", name: "web_search" }] })
  );
  if (hasGemini) attempts.push(() => callGemini(cfg, [{ text: litePrompt }]));
  if (hasClaude) attempts.push(() => callClaude({ messages: [{ role: "user", content: litePrompt }] }));
  if (!attempts.length) {
    throw new Error("AIが未設定です。管理者にご連絡ください");
  }
  let lastErr = null;
  let parsed = null;
  for (const run of attempts) {
    try {
      const text = await run();
      parsed = extractTagJson(text);
      if (parsed && parsed.tags.length) break;
      parsed = null;
      lastErr = new Error("AIの回答からタグを読み取れませんでした");
    } catch (e) {
      lastErr = e;
    }
  }
  if (!parsed) throw lastErr || new Error("AI調査に失敗しました");
  const httpsUrl = (v) => (typeof v === "string" && /^https:\/\/\S+$/.test(v.trim()) ? v.trim() : "");
  return {
    tags: parsed.tags.map((t) => String(t).trim()).filter(Boolean).slice(0, 25),

    image: httpsUrl(parsed.image_url),
    image_source: httpsUrl(parsed.image_source),
    catalogs: (Array.isArray(parsed.catalogs) ? parsed.catalogs : [])
      .map((c) => ({ title: String((c && c.title) || "資料").trim().slice(0, 12), url: httpsUrl(c && c.url) }))
      .filter((c) => c.url)
      .slice(0, 3),
  };
}

// ---------- データ整形 ----------
function flatten(invoices) {
  const out = [];
  for (const inv of invoices) {
    for (const it of inv.items || []) {
      out.push({
        ...it,
        supplier: inv.supplier,
        invoice_date: inv.invoice_date,
        invoice_no: inv.invoice_no,
        invoice_id: inv.id,
        site: inv.site || "",
      });
    }
  }
  return out;
}

function searchRows(rows, query, fields) {
  const tokens = norm(query).split(" ").filter(Boolean);
  if (!tokens.length) return [];
  return rows.filter((it) => {
    const hay = norm(fields.map((f) => it[f]).join(" "));
    return tokens.every((t) => hay.includes(t));
  });
}

// ---------- 五十音インデックス(電話帳方式) ----------
// norm() がカタカナ→ひらがな・全角英数→半角に揃えるので、先頭1文字で行を判定する。
// 読みが取れない漢字・記号始まりは「他」にまとめる。
const KANA_INDEX_ORDER = ["あ", "か", "さ", "た", "な", "は", "ま", "や", "ら", "わ", "英数", "他"];
const KANA_ROWS = {
  あ: "ぁあぃいぅうぇえぉおゔ",
  か: "かがきぎくぐけげこご",
  さ: "さざしじすずせぜそぞ",
  た: "ただちぢっつづてでとど",
  な: "なにぬねの",
  は: "はばぱひびぴふぶぷへべぺほぼぽ",
  ま: "まみむめも",
  や: "ゃやゅゆょよ",
  ら: "らりるれろ",
  わ: "ゎわゐゑをん",
};
function kanaIndexKey(name) {
  const c = norm(name || "").charAt(0);
  if (!c) return "他";
  if (/[a-z0-9]/.test(c)) return "英数";
  for (const k of Object.keys(KANA_ROWS)) {
    if (KANA_ROWS[k].includes(c)) return k;
  }
  return "他";
}

function groupByMaterial(items) {
  const map = new Map();
  for (const it of items) {
    const key = norm(it.name) + "|" + norm(it.maker);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  return [...map.values()].map((rows) => {
    const sorted = [...rows].sort((a, b) =>
      (b.invoice_date || "").localeCompare(a.invoice_date || "")
    );
    const prices = rows.map((r) => r.unit_price).filter((p) => p != null);
    return {
      key: norm(rows[0].name) + "|" + norm(rows[0].maker),
      name: rows[0].name,
      maker: rows[0].maker,
      spec: sorted[0].spec,
      category: sorted[0].category,
      notes: sorted.find((r) => r.notes)?.notes || "",
      latest: sorted[0],
      count: rows.length,
      min: prices.length ? Math.min(...prices) : null,
      max: prices.length ? Math.max(...prices) : null,
      rows: sorted,
      staleMonths: monthsSince(sorted[0].invoice_date),
    };
  });
}

// 料金表から一致品を探す
function matchPriceList(group, pricelists) {
  const gk = norm(group.name);
  let best = null;
  for (const pl of pricelists) {
    for (const it of pl.items || []) {
      const nk = norm(it.name);
      if (nk && (nk.includes(gk) || gk.includes(nk))) {
        const cand = { ...it, supplier: pl.supplier, effective_date: pl.effective_date || pl.received_at };
        if (!best || (cand.effective_date || "") > (best.effective_date || "")) best = cand;
      }
    }
  }
  return best;
}

function SearchBar({ value, onChange, onSubmit, onAI, autoFocus, compact, history, onPick, onRemove, taxMode, onTax }) {
  const [open, setOpen] = useState(false);
  const [hi, setHi] = useState(-1); // キーボード選択中の履歴行

  // 入力中は部分一致で絞り込み、未入力なら全履歴
  const shown = useMemo(() => {
    const list = history || [];
    const v = norm(value.trim());
    return (v ? list.filter((h) => norm(h).includes(v) && h !== value) : list).slice(0, 8);
  }, [history, value]);

  const close = () => { setOpen(false); setHi(-1); };
  const pick = (h) => { close(); onPick && onPick(h); };

  return (
    <div className="relative" style={{ maxWidth: 640, width: "100%" }}>
      <div
        className={
          "flex items-center bg-white border border-gray-200 rounded-full shadow hover:shadow-md transition-shadow px-3 sm:px-4 " +
          (compact ? "h-11" : "h-12")
        }
      >
        <svg width="18" height="18" viewBox="0 0 24 24" className="text-gray-400 shrink-0">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14" />
        </svg>
        <input
          autoFocus={autoFocus}
          value={value}
          onChange={(e) => { onChange(e.target.value); setOpen(true); setHi(-1); }}
          onFocus={() => setOpen(true)}
          onBlur={close}
          onKeyDown={(e) => {
            if (e.key === "ArrowDown" && shown.length) { e.preventDefault(); setOpen(true); setHi((hi + 1) % shown.length); }
            else if (e.key === "ArrowUp" && shown.length) { e.preventDefault(); setHi((hi - 1 + shown.length) % shown.length); }
            else if (e.key === "Escape") close();
            else if (e.key === "Enter") {
              if (open && hi >= 0 && shown[hi]) pick(shown[hi]);
              else { close(); onSubmit(); }
            }
          }}
          placeholder="材料名・メーカー・性質・現場名で検索(例: 桧 KD材 / VVF 2.0 / 山田様邸)"
          className="flex-1 w-0 min-w-0 lg:min-w-[10rem] outline-none px-3 text-base bg-transparent"

function UploadStatus({ jobs, onRetry, onClear }) {
  if (!jobs.length) return null;
  const active = jobs.filter((j) => j.status === "working" || j.status === "queued").length;
  const done = jobs.filter((j) => j.status === "done" || j.status === "dup").length;
  const errors = jobs.filter((j) => j.status === "error").length;
  return (
    <div className="w-full max-w-xl mt-6 space-y-2">
      <div className="flex items-center gap-3 text-xs px-1">
        {active > 0 ? (
          <span className="text-green-700">
            読み取り中… 残り {active} 件 — 待たずに次のファイルを追加できます
          </span>
        ) : (
          <span className="text-gray-500">
            読み取り完了{errors > 0 ? "(失敗 " + errors + " 件)" : ""}
          </span>
        )}
        {active === 0 && done > 0 && onClear && (
          <button onClick={onClear} className="ml-auto text-gray-400 hover:text-gray-600 underline shrink-0">完了分を消す</button>
        )}
      </div>
      {jobs.map((j) => (
        <div key={j.id} className="flex items-center gap-3 text-sm bg-white border border-gray-200 rounded-lg px-4 py-2.5 shadow-sm">
          <span className="text-lg">📄</span>
          <span className="flex-1 truncate">{j.name}</span>
          {j.status === "queued" && <span className="text-gray-400">順番待ち</span>}
          {j.status === "working" && <span className="text-green-700 animate-pulse">読取中…</span>}
          {j.status === "done" && (
            <span className="text-green-700">
              ✓ {j.count}件を{j.merged ? "同じ請求書に追記" : "登録"}
              {j.note && <span className="text-amber-600">({j.note})</span>}
            </span>
          )}
          {j.status === "dup" && <span className="text-amber-600">登録済のためスキップ</span>}
          {j.status === "error" && (
            <>
              <span className="text-red-600 flex-1">読取失敗{j.message ? ` — ${j.message}` : ""}</span>
              {onRetry && (
                <button
                  onClick={() => onRetry(j.id)}
                  className="shrink-0 text-xs text-white bg-red-500 hover:bg-red-600 rounded-full px-3 py-1"
                >再試行</button>
              )}
            </>
          )}
        </div>
      ))}
    </div>
  );
}

function inflationSummary(pred, lastPrice) {
  if (!pred || !pred.ok) return null;
  const rl = Number(pred.rate_low), rh = Number(pred.rate_high);
  const pl = Number(pred.predicted_low), ph = Number(pred.predicted_high);
  if ([rl, rh].some(isNaN)) return null;
  const rate = Math.round((rl + rh) / 2);
  let diff = null;
  if (![pl, ph].some(isNaN) && lastPrice != null) {
    diff = Math.round((pl + ph) / 2 - Number(lastPrice));
  }
  return { rate, diff };
}

function StaleBadge({ months }) {
  if (months == null || months < STALE_MONTHS) return null;
  return (
    <span className="inline-flex items-center gap-1 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5 ml-2 align-middle">
      ⚠ {months}ヶ月前の価格
    </span>
  );
}

  // ---------- 初期読込 ----------
  useEffect(() => {
    (async () => {
      const [inv, pl, ib, st, hist, st2, tg, ct, ah, tpl, olog] = await Promise.all([
        sget(INVOICES_KEY), sget(PRICELIST_KEY), sget(INBOX_KEY, true), sget(SETTINGS_KEY), sget(HISTORY_KEY), sget(SITES_KEY), sget(TAGS_KEY), sget(CART_KEY), sget(ADDR_KEY), sget(ORDER_TPL_KEY), sget(ORDERS_KEY),

      setOrderLog(Array.isArray(olog) ? olog : []);
      setInvoices(inv || []);
      setPricelists(pl || []);
      setInbox(ib || []);
      setHistory(Array.isArray(hist) ? hist : []);
      setSites(Array.isArray(st2) ? st2 : []);
      setAiTags(tg && typeof tg === "object" ? tg : {});
      if (st?.taxMode) setTaxMode(st.taxMode);
      if (st?.predictions) setPredictions(st.predictions);
      if (st?.engine) setEngine(st.engine);
      if (st?.geminiKey) setGeminiKey(st.geminiKey);
      if (st?.geminiModel) setGeminiModel(st.geminiModel);
      if (st?.anthropicKey) setAnthropicKey(st.anthropicKey);
      setLoaded(true);
    })();
  }, []);

  const persistSettings = useCallback(
    (over = {}) => {
      const s = { taxMode, predictions, engine, geminiKey, geminiModel, anthropicKey, ...over };
      sset(SETTINGS_KEY, s).catch(() => {});
    },
    [taxMode, predictions, engine, geminiKey, geminiModel, anthropicKey]
  );
  const changeTax = (m) => {
    setTaxMode(m);
    persistSettings({ taxMode: m });
  };
  const engineCfg = { engine, geminiKey: geminiKey.trim(), geminiModel: geminiModel.trim() };

  // 発注履歴の納品先(現場名・住所)を資材キーごとに集める。
  // 現場向けに発注した資材を、その現場名の検索でヒットさせるため。
  const orderSitesByKey = useMemo(() => {
    const m = {};
    for (const e of orderLog) {
      if (!e.address) continue;
      for (const it of e.items || []) {
        const k = norm(it.name) + "|" + norm(it.maker || "");
        m[k] = m[k] ? m[k] + " " + e.address : e.address;
      }
    }
    return m;
  }, [orderLog]);
  const allItems = useMemo(
    () =>
      flatten(invoices).map((it) => {
        const key = norm(it.name) + "|" + norm(it.maker);
        const t = aiTags[key];
        const os = orderSitesByKey[key];
        const extra = {};
        if (t && t.tags && t.tags.length) extra.ai_tags = t.tags.join(" ");
        if (os) extra.order_sites = os;
        return { ...it, ...extra };
      }),
    [invoices, aiTags, orderSitesByKey]
  );
  const hits = useMemo(
    () => searchRows(allItems, committed, ["name", "maker", "spec", "category", "notes", "supplier", "ai_tags", "site", "order_sites"]),
    [allItems, committed]
  );
  const groups = useMemo(() => groupByMaterial(hits), [hits]);

  const categories = useMemo(() => {
    const set = new Map();
    for (const it of allItems) {
      const c = (it.category || "").trim();
      if (c) set.set(c, (set.get(c) || 0) + 1);
    }
    return [...set.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
  }, [allItems]);

  // ---------- 画面遷移(戻る対応) ----------
  const go = useCallback(
    (v) => {
      if (v === view) return; // 同一画面内の再検索などは履歴に積まない
      setNavStack((s) => [...s.slice(-19), { view, detail }]);
      setView(v);
    },
    [view, detail]
  );
  const goBack = useCallback(() => {
    if (!navStack.length) {
      // 履歴がなければトップへ
      setView("home"); setQuery(""); setCommitted(""); setDetail(null); setAiAnswer(null);
      return;
    }
    const prev = navStack[navStack.length - 1];
    setNavStack(navStack.slice(0, -1));
    setDetail(prev.detail || null);
    setView(prev.view);
  }, [navStack]);

  // ---------- 検索履歴 ----------
  const pushHistory = useCallback((q) => {
    setHistory((prev) => {
      const next = [q, ...prev.filter((x) => x !== q)].slice(0, HISTORY_MAX);
      sset(HISTORY_KEY, next).catch(() => {});
      return next;
    });
  }, []);
  const removeHistory = useCallback((q) => {
    setHistory((prev) => {
      const next = prev.filter((x) => x !== q);
      sset(HISTORY_KEY, next).catch(() => {});
      return next;
    });
  }, []);

  const runSearch = useCallback(
    (q) => {
      const val = (q ?? query).trim();
      if (!val) return;
      pushHistory(val);
      setCommitted(val);
      setAiAnswer(null);
      go("results");
    },
    [query, pushHistory, go]
  );

  const runAI = useCallback(async () => {
    const q = query.trim();
    if (!q) return;
    pushHistory(q);
    setCommitted(q);
    go("results");
    setAiAnswer("loading");
    try {
      const scope = searchRows(allItems, q, ["name", "maker", "spec", "category", "notes", "supplier", "ai_tags", "site", "order_sites"]);
      const ans = await askAI(q, scope.length ? scope : allItems, engineCfg);
      setAiAnswer(ans || "回答を取得できませんでした。");
    } catch {
      setAiAnswer("AIの呼び出しに失敗しました。もう一度お試しください。");
    }
  }, [query, allItems, pushHistory, go]);

  // ---------- 値上がり予測 ----------
  const runPrediction = useCallback(
    async (group) => {
      setPredicting((p) => ({ ...p, [group.key]: true }));
      try {
        const res = await predictPrice(group, engineCfg);
        const withMeta = { ...res, at: new Date().toISOString().slice(0, 10) };
        const next = { ...predictions, [group.key]: withMeta };
        setPredictions(next);
        persistSettings({ predictions: next });
      } catch {
        setPredictions((p) => ({
          ...p,
          [group.key]: { ok: false, raw: "予測の取得に失敗しました。時間をおいて再実行してください。" },
        }));
      } finally {
        setPredicting((p) => ({ ...p, [group.key]: false }));
      }
    },
    [predictions, persistSettings]
  );

  // ---------- 請求書取込 ----------
  // 待ち行列方式: 読み取り中でも次のファイルを追加でき、1つのループが順に処理する
  // (並行処理すると保存の競合や同一請求書の統合漏れが起きるため直列)
  const fileQueueRef = useRef([]);
  const processingRef = useRef(false);
  const handleFiles = useCallback(async (fileList) => {
    const files = [...fileList].filter((f) => isPdfFile(f) || isImageFile(f));
    if (!files.length) return;
    for (const f of files) {
      const jobId = Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "-" + f.name;
      fileQueueRef.current.push({ jobId, f });
      setJobs((j) => [...j, { id: jobId, name: f.name, status: "queued" }]);
    }
    if (processingRef.current) return; // 稼働中のループが追加分も順に処理する
    processingRef.current = true;
    let current = (await sget(INVOICES_KEY)) || [];
    try {
    while (fileQueueRef.current.length) {
      const { jobId, f } = fileQueueRef.current.shift();
      setJobs((j) => j.map((x) => (x.id === jobId ? { ...x, status: "working" } : x)));
      try {
        if (f.size > 40 * 1024 * 1024) {
          throw new Error("40MBを超えています。ファイルを分割してください");
        }
        // 同じファイル(内容が完全一致)を取込済ならスキップ
        const hash = await fileHash(f).catch(() => null);
        if (hash) {
          const dup = await docFindByHash(hash).catch(() => null);
          if (dup) {
            setJobs((j) => j.map((x) => (x.id === jobId ? { ...x, status: "dup" } : x)));
            continue;
          }
        }
        let prep = await prepareFile(f);
        let parsed;
        try {
          parsed = await extractInvoice(prep, engineCfg);
        } catch (e) {
          // 素のPDF送信で通信に失敗した場合、画像に変換して一度だけ再挑戦
          if (prep.type === "application/pdf" && /通信に失敗/.test((e && e.message) || "")) {
            prep = await prepareFile(f, true);
            parsed = await extractInvoice(prep, engineCfg);
          } else {
            throw e;
          }
        }
        if (prep.skipped > 0) {
          parsed.page_note = "先頭8ページのみ読取(残り" + prep.skipped + "ページ)";
        }
        const sig = norm(parsed.supplier) + "|" + (parsed.invoice_no || "") + "|" + (parsed.invoice_date || "");
        // 同じ請求書(番号一致)が既にある場合: スキップではなく明細を統合
        // (複数ページを写真で分けて撮った場合に対応)
        const existing = parsed.invoice_no
          ? current.find((inv) => inv.sig === sig)
          : null;
        if (existing) {
          // 追加ページも同じ請求書の原本として保存(失敗しても取込は続行)
          try {
            await docPut({ docId: jobId, invoiceId: existing.id, name: f.name, mime: f.type, blob: f, hash, added_at: new Date().toISOString() });
          } catch {}
          const seen = new Set(
            existing.items.map((it) => norm(it.name) + "|" + it.unit_price + "|" + it.quantity)
          );
          const fresh = (parsed.items || []).filter(
            (it) => it.name && !seen.has(norm(it.name) + "|" + it.unit_price + "|" + it.quantity)
          );
          if (!fresh.length) {
            setJobs((j) => j.map((x) => (x.id === jobId ? { ...x, status: "dup" } : x)));
            continue;
          }
          current = current.map((inv) =>
            inv.sig === sig
              ? { ...inv, items: [...inv.items, ...fresh], site: inv.site || parsed.site || "" }
              : inv
          );
          await sset(INVOICES_KEY, current);
          setInvoices(current);
          setJobs((j) =>
            j.map((x) =>
              x.id === jobId
                ? {
                    ...x, status: "done", count: fresh.length, merged: true,
                    note: [parsed.engine_note ? "Gemini不調のためClaudeで読取" : "", parsed.page_note || ""].filter(Boolean).join("・"),
                  }
                : x
            )
          );
          continue;
        }
        const record = {
          id: jobId, sig, file: f.name,
          supplier: parsed.supplier || "不明な仕入先",
          invoice_no: parsed.invoice_no || "",
          invoice_date: parsed.invoice_date || "",
          site: parsed.site || "",
          items: (parsed.items || []).filter((it) => it.name),
          added_at: new Date().toISOString(),
        };
        // 原本ファイルを保存(失敗しても取込は続行)
        try {
          await docPut({ docId: jobId, invoiceId: record.id, name: f.name, mime: f.type, blob: f, hash, added_at: record.added_at });
        } catch {}
        current = [...current, record];
        await sset(INVOICES_KEY, current);
        setInvoices(current);
        setJobs((j) =>
          j.map((x) =>
            x.id === jobId
              ? {
                  ...x, status: "done", count: record.items.length,
                  note: [parsed.engine_note ? "Gemini不調のためClaudeで読取" : "", parsed.page_note || ""].filter(Boolean).join("・"),
                }
              : x
          )
        );
      } catch (e) {
        failedFilesRef.current[jobId] = f;
        let msg = (e && e.message) || "";
        if (/通信に失敗/.test(msg)) {
          // ファイルの問題か、環境の問題かを極小リクエストで判定
          const alive = await probeClaude();
          msg = alive
            ? "送信できましたがこのファイルの処理中に接続が切れました。数分おいて「再試行」を押してください。続く場合はPDFを数ページずつに分けてください"
            : ENV_BLOCK_MSG;
        }
        setJobs((j) =>
          j.map((x) =>
            x.id === jobId
              ? { ...x, status: "error", message: msg }
              : x
          )
        );
      }
    }
    } finally {
      processingRef.current = false;
    }
    // 新しい資材の検索タグを裏で調査(失敗しても取込には影響しない)
    if (autoTagRef.current) autoTagRef.current(current);
  }, [engineCfg.engine, engineCfg.geminiKey, engineCfg.geminiModel]);

  const retryJob = useCallback(
    (jobId) => {
      const f = failedFilesRef.current[jobId];
      if (!f) return;
      delete failedFilesRef.current[jobId];
      setJobs((j) => j.filter((x) => x.id !== jobId));
      handleFiles([f]);
    },
    [handleFiles]
  );
  const clearDoneJobs = useCallback(() => {
    setJobs((j) => j.filter((x) => x.status === "working" || x.status === "queued" || x.status === "error"));
  }, []);

  // ---------- 仕入先: 料金表アップロード(共有受信箱へ) ----------
  const handleSupplierFiles = useCallback(
    async (fileList) => {
      const files = [...fileList].filter(
        (f) => f.type === "application/pdf" || f.type.startsWith("image/") ||
          /\.(pdf|jpe?g|png|webp)$/i.test(f.name)
      );
      if (!files.length) return;
      setSupDone("working");
      try {
        let box = (await sget(INBOX_KEY, true)) || [];
        let total = 0;
        for (const f of files) {
          let prepS = await prepareFile(f);
          let parsed;
          try {
            parsed = await extractPriceList(prepS, supName, engineCfg);
          } catch (e) {
            if (prepS.type === "application/pdf" && /通信に失敗/.test((e && e.message) || "")) {
              prepS = await prepareFile(f, true);
              parsed = await extractPriceList(prepS, supName, engineCfg);
            } else {
              throw e;
            }
          }
          const sub = {
            id: Date.now() + "-" + f.name,
            supplier: supName || "名称未入力の仕入先",
            file: f.name,
            effective_date: parsed.effective_date || "",
            items: (parsed.items || []).filter((it) => it.name),
            received_at: new Date().toISOString().slice(0, 10),
            status: "pending",
          };
          total += sub.items.length;
          box = [...box, sub];
        }
        await sset(INBOX_KEY, box, true);
        setInbox(box);
        // GitHub版はサーバーが無いため、担当者へ返送する添付ファイルも書き出す
        const newSubs = box.slice(-files.length);
        const blob = new Blob([JSON.stringify(newSubs, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "料金表_" + (supName || "仕入先") + "_" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
        setSupDone({ ok: true, count: total });
      } catch {
        setSupDone({ ok: false });
      }
    },
    [supName, engineCfg.engine, engineCfg.geminiKey, engineCfg.geminiModel]
  );

  // ---------- 受信箱: 反映 / 削除 ----------
  const applySubmission = useCallback(
    async (sub) => {
      const nextPl = [...pricelists, { ...sub, status: "applied" }];
      const nextBox = inbox.map((s) => (s.id === sub.id ? { ...s, status: "applied" } : s));
      try {
        await sset(PRICELIST_KEY, nextPl);
        await sset(INBOX_KEY, nextBox, true);
        setPricelists(nextPl);
        setInbox(nextBox);
      } catch {}
    },
    [pricelists, inbox]
  );
  const removeSubmission = useCallback(
    async (id) => {
      const nextBox = inbox.filter((s) => s.id !== id);
      try {
        await sset(INBOX_KEY, nextBox, true);
        setInbox(nextBox);
      } catch {}
    },
    [inbox]
  );
  const deleteInvoice = useCallback(
    async (id) => {
      const next = invoices.filter((i) => i.id !== id);
      try {
        await sset(INVOICES_KEY, next);
        setInvoices(next);
      } catch {}
      try { await docsDeleteForInvoice(id); } catch {}
    },
    [invoices]
  );

  // ---------- 明細の個別削除 ----------
  const deleteItem = useCallback(
    async (row) => {
      let removed = false;
      const next = invoices.map((inv) => {
        if (inv.id !== row.invoice_id || removed) return inv;
        const idx = inv.items.findIndex(
          (it) =>
            norm(it.name) === norm(row.name) &&
            it.unit_price === row.unit_price &&
            it.quantity === row.quantity &&
            (it.spec || "") === (row.spec || "")
        );
        if (idx < 0) return inv;
        removed = true;
        return { ...inv, items: inv.items.filter((_, i) => i !== idx) };
      });
      if (!removed) return;
      try {
        await sset(INVOICES_KEY, next);
        setInvoices(next);
      } catch {
        return;
      }
      // 詳細画面を最新データで作り直す(全明細が消えたら前の画面へ)
      if (detail) {
        const freshGroups = groupByMaterial(
          searchRows(
            flatten(next).map((it) => {
              const key = norm(it.name) + "|" + norm(it.maker);
              const t = aiTags[key];
              const os = orderSitesByKey[key];
              const extra = {};
              if (t && t.tags && t.tags.length) extra.ai_tags = t.tags.join(" ");
              if (os) extra.order_sites = os;
              return { ...it, ...extra };
            }),
            committed,
            ["name", "maker", "spec", "category", "notes", "supplier", "ai_tags", "site", "order_sites"]
          )
        );
        const g2 = freshGroups.find((g) => g.key === detail.key);
        if (g2) setDetail(g2);
        else goBack();
      }
    },
    [invoices, detail, committed, goBack, aiTags, orderSitesByKey]
  );

  // ---------- AI検索タグ ----------
  const saveTags = useCallback((updater) => {
    setAiTags((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      sset(TAGS_KEY, next).catch(() => {});
      return next;
    });
  }, []);
  const tagOne = useCallback(
    async (group) => {
      const res = await fetchMaterialTags(group, engineCfg);
      if (res.tags.length) {
        saveTags((prev) => ({ ...prev, [group.key]: { ...res, at: new Date().toISOString().slice(0, 10) } }));
      }
      return res;

    [engineCfg.engine, engineCfg.geminiKey, engineCfg.geminiModel, saveTags]
  );
  const retagDetail = useCallback(async () => {

    setTagBusy(true);
    try {
      await tagOne(detail);

    }

  const untaggedGroups = useMemo(() => allGroups.filter((g) => !aiTags[g.key]), [allGroups, aiTags]);
  const runBulkTagging = useCallback(async () => {
    if (tagging || !untaggedGroups.length) return;
    const todo = untaggedGroups;
    setTagging({ done: 0, total: todo.length, fail: 0, current: "" });
    for (const g of todo) {
      setTagging((t) => t && { ...t, current: g.name });
      try {
        await tagOne(g);
        setTagging((t) => t && { ...t, done: t.done + 1 });
      } catch {
        setTagging((t) => t && { ...t, done: t.done + 1, fail: t.fail + 1 });
      }
    }
    setTagging((t) => t && { ...t, current: "", finished: true });
  }, [tagging, untaggedGroups, tagOne]);

      for (const g of todo.slice(0, 30)) {
        try { await tagOne(g); } catch {}
      }
    };
  }, [aiTags, tagOne]);

  // ---------- 納品先の登録 ----------

      place: sites.length ? "倉庫" : "現場",
      siteId: sites[0]?.id || "",
      address: "",
      copied: false,
    });
  };
  const openCartOrder = (supplier, items) => {
    setOrder({
      mode: "cart",
      supplier,
      items: items.map((c) => ({ key: c.key, name: c.name, spec: c.spec, maker: c.maker, unit: c.unit, qty: String(c.qty) })),
      place: sites.length ? "倉庫" : "現場",
      siteId: sites[0]?.id || "",
      address: "",
      copied: false,
    });
  };
  const buildOrderText = () => {
    if (!order) return "";
    const supplier = order.supplier || "";
    let placeLabel = order.place;
    let addr = "";
    if (order.place === "倉庫") {
      const site = sites.find((s) => s.id === order.siteId);
      if (site) {
        placeLabel = "倉庫(" + site.name + ")";
        addr = site.address || "";
      }
    } else {
      addr = order.address.trim();
    }
    const itemLine = (it) =>
      it.name + (it.spec ? " " + it.spec : "") + (it.maker ? "(" + it.maker + ")" : "");
    const itemLines =
      order.items.length === 1
        ? [
            "■品名: " + itemLine(order.items[0]),
            "■数量: " + order.items[0].qty + (order.items[0].unit ? " " + order.items[0].unit : ""),
          ]
        : [
            "■発注品目:",
            ...order.items.map(
              (it) => "・" + itemLine(it) + " × " + it.qty + (it.unit ? " " + it.unit : "")
            ),
          ];
    const lines = [
      supplier ? supplier + " 御中" : null,
      supplier ? "" : null,
      ...(orderTpl.header ? orderTpl.header.split("\n") : []),
      "",
      ...itemLines,
      "■納品場所: " + placeLabel,
      addr ? "■納品先住所: " + addr : null,
      "",
      ...(orderTpl.footer ? orderTpl.footer.split("\n") : []),
    ];
    return lines.filter((l) => l !== null).join("\n");
  };
  // 手で編集された文面があればそれを優先する
  const orderText = order ? (order.customText != null ? order.customText : buildOrderText()) : "";
  const orderValid =
    order &&
    order.items.length > 0 &&
    order.items.every((it) => Number(it.qty) > 0) &&
    (order.place !== "倉庫" || sites.length > 0);
  // 現場・その他の住所は、送信操作をした時点で履歴に残す(次回はクリックで再利用)
  const recordOrderAddress = () => {
    if (!order || order.place === "倉庫") return;
    const a = order.address.trim();
    if (!a) return;
    setAddrHistory((prev) => {
      const next = [a, ...prev.filter((x) => x !== a)].slice(0, ADDR_MAX);
      sset(ADDR_KEY, next).catch(() => {});
      return next;
    });
  };
  const removeAddr = (a) => {
    setAddrHistory((prev) => {
      const next = prev.filter((x) => x !== a);
      sset(ADDR_KEY, next).catch(() => {});
      return next;
    });
  };
  // コピー/LINE/メールを実行した時点で発注履歴に記録する。
  // 同じ発注画面内で複数回押した場合は1件にまとめ、送信手段と文面を更新する。
  const recordOrderHistory = (method) => {
    if (!order) return;
    const id = order.loggedId || Date.now() + "-o";
    const entry = {
      id,
      at: new Date().toISOString(),
      supplier: order.supplier || "",
      items: order.items.map((it) => ({ name: it.name, spec: it.spec, maker: it.maker, unit: it.unit, qty: it.qty })),
      place: order.place,
      address:
        order.place === "倉庫"
          ? (() => { const s = sites.find((x) => x.id === order.siteId); return s ? s.name + (s.address ? "(" + s.address + ")" : "") : "倉庫"; })()
          : order.address.trim(),
      method,
      text: orderText,
    };
    setOrderLog((prev) => {
      const next = [entry, ...prev.filter((e) => e.id !== id)].slice(0, 200);
      sset(ORDERS_KEY, next).catch(() => {});
      return next;
    });
    if (!order.loggedId) setOrder((o) => o && { ...o, loggedId: id });
    // カートからの発注は、送信した品目を自動でカートから外す
    if (order.mode === "cart") {
      saveCart(cart.filter((c) => !order.items.some((it) => it.key === c.key)));
    }
    setOrderLogMsg(true);
    setTimeout(() => setOrderLogMsg(false), 2500);
  };
  const removeOrderLog = (id) => {
    setOrderLog((prev) => {
      const next = prev.filter((e) => e.id !== id);
      sset(ORDERS_KEY, next).catch(() => {});
      return next;
    });
  };
  const copyOrder = () => {
    recordOrderAddress();
    recordOrderHistory("コピー");
    const text = orderText;
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    };
    const done = () => setOrder((o) => o && { ...o, copied: true });
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => { fallback(); done(); });
    } else {
      fallback();
      done();
    }
  };
  const lineOrder = () => {
    recordOrderAddress();
    recordOrderHistory("LINE");

  };
  const mailOrder = () => {
    recordOrderAddress();
    recordOrderHistory("メール");
    const subject =
      order && order.mode === "cart"
        ? "発注: " + order.items.length + "品目(" + (order.supplier || "") + ")"
        : "発注: " + (order && order.items[0] ? order.items[0].name : "");
    window.location.href =
      "mailto:?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(orderText);
  };

  // ---------- 原本ビューア ----------
  const openDocs = useCallback(async (inv) => {
    let docs = [];
    try { docs = await docsForInvoice(inv.id); } catch {}

  const closeDocs = useCallback(() => {
    setDocView((v) => {
      if (v) v.docs.forEach((d) => URL.revokeObjectURL(d.url));
      return null;
    });
  }, []);

  // ---------- 依頼文コピー ----------
  const copyRequestText = () => {
    const text = `お世話になっております。
現在の料金表(写真またはPDF)のご共有をお願いできますでしょうか。

下記リンクを開き、「仕入先の方はこちら」から貴社名をご入力の上、
料金表の写真かPDFを選ぶだけで自動で読み取られます。
読み取り後に保存される「料金表_○○.json」ファイルを、
このメールへの返信に添付してお送りください。

▼読み取りページ
${window.location.href.split("#")[0]}

お手数をおかけしますが、よろしくお願いいたします。`;
    navigator.clipboard?.writeText(text);
  };

  // ---------- D&D ----------
  const onDragEnter = (e) => { e.preventDefault(); dragDepth.current++; setDragging(true); };
  const onDragLeave = (e) => { e.preventDefault(); if (--dragDepth.current <= 0) setDragging(false); };
  const onDrop = (e) => {
    e.preventDefault();
    dragDepth.current = 0;
    setDragging(false);
    if (view === "supplier") handleSupplierFiles(e.dataTransfer.files);
    else handleFiles(e.dataTransfer.files);
  };

    setView("home"); setQuery(""); setCommitted(""); setDetail(null); setAiAnswer(null);

  // ============================================================
  return (
    <div
      className="min-h-screen bg-white text-gray-800"
      onDragEnter={onDragEnter}
      onDragOver={(e) => e.preventDefault()}
      onDragLeave={onDragLeave}
      onDrop={onDrop}
      style={{ fontFamily: "'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif" }}
    >
      <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.heic,application/pdf,image/*" multiple className="hidden"
        onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
      <input ref={supFileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/*" multiple className="hidden"
        onChange={(e) => { handleSupplierFiles(e.target.files); e.target.value = ""; }} />

      {dragging && (
        <div className="fixed inset-0 z-50 bg-green-700 bg-opacity-90 flex flex-col items-center justify-center text-white pointer-events-none">
          <div className="text-6xl mb-4">📄</div>
          <div className="text-2xl font-bold">
            {view === "supplier" ? "料金表(写真/PDF)をここにドロップ" : "請求書(PDF/写真)をここにドロップ"}
          </div>
        </div>
      )}

      {/* ================= ホーム ================= */}
      {view === "home" && (
        <div className="flex flex-col items-center px-4 pb-24" style={{ paddingTop: "13vh" }}>
          <Logo size="large" onClick={goHome} />
          <p className="mt-3 text-sm text-gray-500">

          </p>

          <div className="mt-8 w-full flex justify-center">
            <SearchBar value={query} onChange={setQuery} onSubmit={() => runSearch()} onAI={runAI} autoFocus
              history={history} onPick={(h) => { setQuery(h); runSearch(h); }} onRemove={removeHistory}
              taxMode={taxMode} onTax={changeTax} />
          </div>

          <div className="mt-7 flex flex-wrap justify-center gap-3">
            <button onClick={() => fileRef.current?.click()} className="px-4 py-2 text-sm bg-gray-50 hover:bg-gray-100 border border-gray-100 hover:border-gray-200 rounded">請求書を取り込む(PDF/写真)</button>
            <button onClick={() => go("manage")} className="px-4 py-2 text-sm bg-gray-50 hover:bg-gray-100 border border-gray-100 hover:border-gray-200 rounded">

                </button>

              </div>

          ) : (
            (() => {
              const bySupplier = [];
              for (const c of cart) {
                let g = bySupplier.find((x) => x.supplier === c.supplier);
                if (!g) { g = { supplier: c.supplier, items: [] }; bySupplier.push(g); }
                g.items.push(c);
              }
              const conv = (n, t) => {
                let v = Number(n);
                if (taxMode === "in" && t !== "in") v = v * (1 + TAX_RATE);
                if (taxMode === "ex" && t === "in") v = v / (1 + TAX_RATE);
                return v;
              };
              const knownTotal = Math.round(
                cart.reduce((s, c) => s + (c.unit_price != null ? conv(c.unit_price, c.price_tax) * c.qty : 0), 0)
              );

            <button
              onClick={() => {
                const data = { invoices, pricelists, exported_at: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "問屋さんバックアップ_" + new Date().toISOString().slice(0, 10) + ".json";
                a.click();
                URL.revokeObjectURL(a.href);
              }}
              className="text-xs text-gray-700 border border-gray-300 hover:bg-gray-50 rounded-full px-3 py-1"
            >書き出す</button>
            <label className="text-xs text-gray-700 border border-gray-300 hover:bg-gray-50 rounded-full px-3 py-1 cursor-pointer">
              読み込む
              <input type="file" accept=".json" className="hidden"
                onChange={async (e) => {
                  const f = e.target.files && e.target.files[0];
                  e.target.value = "";
                  if (!f) return;
                  try {
                    const d = JSON.parse(await f.text());
                    if (Array.isArray(d.invoices)) { await sset(INVOICES_KEY, d.invoices); setInvoices(d.invoices); }
                    if (Array.isArray(d.pricelists)) { await sset(PRICELIST_KEY, d.pricelists); setPricelists(d.pricelists); }
                    window.alert("バックアップを読み込みました");
                  } catch { window.alert("バックアップファイルを読み込めませんでした"); }
                }} />
            </label>
            <span className="text-xs text-gray-400">データはブラウザ内保存のため、PC入替時はこちらで移行してください</span>
          </div>

          {/* 書類一覧 */}
          <h2 className="font-medium mt-8">取り込んだ書類</h2>
          <UploadStatus jobs={jobs} onRetry={retryJob} onClear={clearDoneJobs} />
          {invoices.length === 0 ? (
            <div className="text-sm text-gray-400 mt-3">まだ書類が登録されていません。</div>
          ) : (
            <div className="mt-3 border border-gray-200 rounded-xl divide-y divide-gray-100">
              {[...invoices]
                .sort((a, b) => (b.invoice_date || "").localeCompare(a.invoice_date || ""))
                .map((inv) => (
                  <div key={inv.id} className="flex items-center gap-4 px-4 py-3">
                    <span className="text-lg">📄</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium truncate">
                        {inv.supplier}
                        {inv.invoice_no && <span className="text-gray-400 font-normal"> #{inv.invoice_no}</span>}
                      </div>
                      <div className="text-xs text-gray-500">{fmtDate(inv.invoice_date)} ・ 明細 {inv.items.length} 件 ・ {inv.file}</div>
                    </div>
                    <button
                      onClick={() => openDocs(inv)}
                      className="text-sm text-green-800 border border-green-200 hover:bg-green-50 rounded px-3 py-1.5 shrink-0"
                    >書類を見る</button>
                    <button
                      onClick={() => { if (window.confirm(`「${inv.supplier} ${inv.invoice_date}」を削除しますか?`)) deleteInvoice(inv.id); }}
                      className="text-sm text-red-600 hover:bg-red-50 rounded px-3 py-1.5 shrink-0"
                    >削除</button>
                  </div>
                ))}
            </div>
          )}
        </div>
      )}

      {/* ================= 仕入先向けアップロードページ ================= */}
      {view === "supplier" && (
        <div className="flex flex-col items-center px-4 pb-24" style={{ paddingTop: "10vh" }}>
          <Logo size="large" />
          <h1 className="mt-6 text-xl font-bold">料金表のご提供ページ(仕入先さま用)</h1>
          <p className="mt-2 text-sm text-gray-500 text-center leading-relaxed" style={{ maxWidth: 480 }}>
            いつもお世話になっております。<br />
            貴社名をご入力の上、現在の料金表(写真またはPDF)をアップロードしてください。内容は自動で読み取られ、担当者が確認します。<br />
            <span className="text-gray-400">このページからアップロード内容以外の社内データを見ることはできません。</span>
          </p>

          <div className="mt-6 w-full" style={{ maxWidth: 440 }}>
            <label className="text-sm text-gray-600">貴社名</label>
            <input
              value={supName}
              onChange={(e) => setSupName(e.target.value)}
              placeholder="例: 〇〇建材株式会社"
              className="mt-1 w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:border-green-600"
            />

            <div
              onClick={() => supName.trim() ? supFileRef.current?.click() : window.alert("先に貴社名をご入力ください")}
              className="mt-4 border-2 border-dashed border-green-300 hover:border-green-500 rounded-2xl px-8 py-10 text-center cursor-pointer transition-colors"
            >
              <div className="text-3xl mb-2">📋</div>
              <div className="font-medium text-gray-700">料金表をここにドロップ</div>
              <div className="mt-1 text-sm text-gray-500">またはクリックして選択(写真 / PDF、複数可)</div>
            </div>

            {supDone === "working" && (
              <div className="mt-4 text-sm text-green-700 animate-pulse text-center">料金表を読み取っています…</div>
            )}
            {supDone && supDone !== "working" && supDone.ok && (
              <div className="mt-4 border border-green-200 bg-green-50 rounded-xl p-4 text-center">
                <div className="text-green-800 font-medium">✓ 読み取りが完了し、ファイルを保存しました</div>
                <div className="text-sm text-green-700 mt-1">
                  {supDone.count} 件の商品を読み取りました。ダウンロードされた「料金表_○○.json」ファイルを、メール等でご担当者へご返送ください。ご協力ありがとうございました。
                </div>
              </div>
            )}
            {supDone && supDone !== "working" && supDone.ok === false && (
              <div className="mt-4 border border-red-200 bg-red-50 rounded-xl p-4 text-center text-sm text-red-700">
                読み取りに失敗しました。ファイルをご確認の上、もう一度お試しください。
              </div>
            )}
          </div>

          <button
            onClick={goBack}
            className="mt-10 text-sm text-gray-600 hover:bg-gray-50 border border-gray-200 rounded-full px-4 py-1.5"
          >← 戻る</button>
        </div>
      )}

      {/* ================= 発注モーダル ================= */}
      {order && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={() => setOrder(null)}>
          <div className="bg-white rounded-2xl w-full max-w-lg max-h-[88vh] overflow-auto" onClick={(e) => e.stopPropagation()}>
            <div className="px-5 py-4 border-b border-gray-100">
              <div className="font-bold">
                発注 — {order.mode === "cart" ? (order.supplier || "仕入先") + "(" + order.items.length + "品目)" : order.items[0].name}
              </div>
              <div className="text-xs text-gray-500 mt-0.5">
                {order.mode === "cart"
                  ? "カートからのまとめ発注"
                  : [order.items[0].maker, order.items[0].spec].filter(Boolean).join(" ・ ") +
                    (order.supplier ? " / 発注先: " + order.supplier : "")}
              </div>
            </div>
            <div className="p-5 space-y-4 text-sm">
              {order.mode === "single" ? (
                <div>
                  <label className="text-xs text-gray-600">数量</label>
                  <div className="flex items-center gap-2 mt-1">
                    <input
                      type="number" min="1"
                      value={order.items[0].qty}
                      onChange={(e) => setOrder({ ...order, items: [{ ...order.items[0], qty: e.target.value }], customText: null, copied: false })}
                      className="w-24 border border-gray-300 rounded-lg px-3 py-2 text-base sm:text-sm outline-none focus:border-green-600"
                    />
                    <span className="text-gray-500">{order.items[0].unit || ""}</span>
                  </div>
                </div>
              ) : (
                <div>
                  <label className="text-xs text-gray-600">発注品目(数量の変更はカート画面で)</label>
                  <div className="mt-1 border border-gray-200 rounded-lg divide-y divide-gray-100 max-h-40 overflow-auto">
                    {order.items.map((it, i) => (
                      <div key={i} className="flex items-center justify-between gap-3 px-3 py-2">
                        <span className="truncate">{it.name}{it.spec ? " " + it.spec : ""}</span>
                        <span className="text-gray-500 shrink-0">× {it.qty}{it.unit ? " " + it.unit : ""}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              <div>
                <label className="text-xs text-gray-600">納品場所</label>
                <div className="flex gap-4 mt-1">
                  {["倉庫", "現場", "その他"].map((p) => (
                    <label key={p} className="flex items-center gap-1.5 cursor-pointer">
                      <input type="radio" checked={order.place === p} onChange={() => setOrder({ ...order, place: p, customText: null, copied: false })} />
                      {p}
                    </label>
                  ))}
                </div>
              </div>
              {order.place === "倉庫" ? (
                sites.length ? (
                  <div>
                    <label className="text-xs text-gray-600">納品先(登録済み)</label>
                    <select
                      value={order.siteId}
                      onChange={(e) => setOrder({ ...order, siteId: e.target.value, customText: null, copied: false })}
                      className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-2 text-base sm:text-sm bg-white outline-none focus:border-green-600"
                    >
                      {sites.map((s) => (
                        <option key={s.id} value={s.id}>{s.name}{s.address ? "(" + s.address + ")" : ""}</option>
                      ))}
                    </select>
                  </div>
                ) : (
                  <div className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 leading-relaxed">
                    納品先が未登録です。データ管理の「納品先の登録」から倉庫・会社の住所を登録すると、ここで選べるようになります。
                  </div>
                )
              ) : (
                <div>
                  <label className="text-xs text-gray-600">
                    {order.place === "現場" ? "現場の住所・名称" : "納品先の住所"}
                    {addrHistory.length > 0 && <span className="text-gray-400 ml-1.5">(クリックで履歴から選べます)</span>}
                  </label>
                  <AddressInput
                    value={order.address}
                    onChange={(v) => setOrder({ ...order, address: v, customText: null, copied: false })}
                    history={addrHistory}
                    onRemove={removeAddr}
                    placeholder="例: 〇〇市〇〇町1-2-3 〇〇様邸"
                  />
                </div>
              )}
              <div>
                <div className="flex items-center gap-2">
                  <label className="text-xs text-gray-600 flex-1">
                    依頼文(そのまま編集できます)
                  </label>
                  {order.customText != null && (
                    <button
                      onClick={() => setOrder({ ...order, customText: null, copied: false })}
                      className="text-xs text-gray-500 border border-gray-200 hover:bg-gray-50 rounded-full px-2.5 py-0.5"
                      title="手で直した内容を破棄して自動作成し直します"
                    >自動作成に戻す</button>
                  )}
                </div>
                <textarea
                  value={orderText}
                  onChange={(e) => setOrder({ ...order, customText: e.target.value, copied: false })}
                  rows={10}
                  className="mt-1 w-full bg-gray-50 border border-gray-200 rounded-lg p-3 text-base sm:text-xs leading-relaxed outline-none focus:border-green-600 focus:bg-white"
                  style={{ fontFamily: "inherit", resize: "vertical" }}
                />
                {order.customText != null && (
                  <div className="text-xs text-amber-700 mt-1">
                    手で編集した文面を送ります。数量や納品場所を変えると自動作成に戻ります。
                  </div>
                )}
              </div>
              <div className="flex flex-wrap gap-2 pt-1">
                <button
                  onClick={copyOrder}
                  disabled={!orderValid}
                  className="text-sm text-white bg-green-700 hover:bg-green-800 rounded-full px-4 py-2 disabled:opacity-50"
                >依頼文をコピー</button>
                <button
                  onClick={lineOrder}
                  disabled={!orderValid}
                  className="text-sm text-white rounded-full px-4 py-2 disabled:opacity-50"
                  style={{ background: "#06C755" }}
                >LINEで送る</button>
                <button
                  onClick={mailOrder}
                  disabled={!orderValid}
                  className="text-sm text-green-800 border border-green-300 hover:bg-green-50 rounded-full px-4 py-2 disabled:opacity-50"
                >メールで送る</button>
                <button
                  onClick={() => setOrder(null)}
                  className="text-sm text-gray-600 border border-gray-200 hover:bg-gray-50 rounded-full px-4 py-2"
                >閉じる</button>
              </div>
              {orderLogMsg && (
                <div className="text-green-700 text-xs">
                  ✓ 発注履歴に追加されました。{order.mode === "cart" && "発注した品目はカートから外しました。"}
                </div>
              )}
              {order.copied && (
                <div className="text-green-700 text-xs">✓ コピーしました。LINEやメールに貼り付けて送信できます。</div>
              )}
              <div className="text-xs text-gray-400 leading-relaxed">
                「LINEで送る」はスマホでLINEアプリの共有画面が開きます(パソコンではコピーしてお使いください)。メールは宛先を入れてから送信してください。
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ================= 原本ビューア ================= */}
      {docView && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={closeDocs}>
          <div className="bg-white rounded-2xl w-full max-w-3xl max-h-[88vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center gap-3 px-5 py-3 border-b border-gray-100">
              <span className="text-lg">📄</span>
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium truncate">{docView.invoice.supplier}</div>
                <div className="text-xs text-gray-500">
                  {fmtDate(docView.invoice.invoice_date)} ・ {docView.docs.length} ファイル
                </div>
              </div>
              <button
                onClick={closeDocs}
                className="text-sm text-gray-600 border border-gray-200 hover:bg-gray-50 rounded-full px-4 py-1.5 shrink-0"
              >閉じる</button>
            </div>
            <div className="overflow-auto p-4 space-y-6">
              {docView.docs.map((d, i) => (
                <div key={i}>
                  <div className="text-xs text-gray-500 mb-1.5 truncate">{d.name}</div>
                  {(d.mime || "").includes("pdf") ? (
                    <iframe src={d.url} title={d.name} className="w-full border border-gray-200 rounded-lg" style={{ height: "70vh" }} />
                  ) : (
                    <img src={d.url} alt={d.name} className="max-w-full rounded-lg border border-gray-200" />
                  )}
                  <a href={d.url} download={d.name} className="inline-block mt-1.5 text-xs text-green-800 hover:underline">ダウンロード</a>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* フッター */}
      <div
        className="fixed bottom-0 inset-x-0 flex items-center justify-center gap-4 text-xs text-gray-400 py-2 bg-white border-t border-gray-50"
        style={{ paddingBottom: "calc(0.5rem + env(safe-area-inset-bottom))" }}
      >
        <span>問屋さん — 仕入価格はこのブラウザ内にのみ保存されます(端末を変える場合は下記バックアップを)</span>
        {view === "home" && (
          <button onClick={() => { setSupDone(null); go("supplier"); }} className="text-green-700 hover:underline">
            仕入先の方はこちら(料金表アップロード)
          </button>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<ShizaiSearch />);

</script>
</body>
</html>
